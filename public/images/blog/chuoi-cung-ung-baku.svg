<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- panel background -->
  <rect x="20" y="40" width="760" height="330" rx="10" fill="#ffffff" stroke="#d8dde1" stroke-width="2"/>

  <!-- stage 1: suppliers -->
  <g>
    <rect x="48" y="90" width="150" height="70" rx="8" fill="#eef1ef" stroke="#8a8f98" stroke-width="2"/>
    <text x="123" y="118" font-size="13" fill="#5a6270" text-anchor="middle" font-weight="600">Nhà máy / Factory</text>
    <text x="123" y="136" font-size="11" fill="#5a6270" text-anchor="middle">Bê tông, thép, segment</text>
    <text x="123" y="150" font-size="11" fill="#5a6270" text-anchor="middle">Concrete, rebar, segments</text>

    <rect x="48" y="190" width="150" height="70" rx="8" fill="#eef1ef" stroke="#8a8f98" stroke-width="2"/>
    <text x="123" y="218" font-size="13" fill="#5a6270" text-anchor="middle" font-weight="600">Nhà cung cấp quốc tế</text>
    <text x="123" y="236" font-size="11" fill="#5a6270" text-anchor="middle">International supplier</text>
    <text x="123" y="250" font-size="11" fill="#5a6270" text-anchor="middle">TBM, tín hiệu, đoàn tàu</text>
  </g>

  <!-- arrows to transit -->
  <g stroke="#5a6270" stroke-width="2.5" fill="none">
    <line x1="198" y1="125" x2="268" y2="175" marker-end="url(#arrow)"/>
    <line x1="198" y1="225" x2="268" y2="190" marker-end="url(#arrow)"/>
  </g>

  <!-- stage 2: transit warehouse / customs -->
  <g>
    <rect x="280" y="140" width="170" height="110" rx="8" fill="#dfe6de" stroke="#8a8f98" stroke-width="2"/>
    <text x="365" y="170" font-size="14" fill="#1a1d23" text-anchor="middle" font-weight="600">Kho trung chuyển</text>
    <text x="365" y="188" font-size="12" fill="#1a1d23" text-anchor="middle">Transit warehouse</text>
    <text x="365" y="210" font-size="11" fill="#5a6270" text-anchor="middle">Hải quan · Tồn kho an toàn</text>
    <text x="365" y="226" font-size="11" fill="#5a6270" text-anchor="middle">Customs · Safety stock</text>
  </g>

  <!-- arrow to site -->
  <line x1="450" y1="195" x2="540" y2="195" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- stage 3: construction site -->
  <g>
    <rect x="552" y="90" width="200" height="200" rx="8" fill="#0a5c4a" opacity="0.95"/>
    <text x="652" y="125" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Công trường</text>
    <text x="652" y="145" font-size="12" fill="#eafff6" text-anchor="middle">Construction site</text>

    <!-- small TBM icon -->
    <circle cx="652" cy="190" r="30" fill="#ffffff" opacity="0.15"/>
    <circle cx="652" cy="190" r="22" fill="none" stroke="#eafff6" stroke-width="2.5"/>
    <g stroke="#eafff6" stroke-width="2">
      <line x1="652" y1="168" x2="652" y2="212"/>
      <line x1="630" y1="190" x2="674" y2="190"/>
    </g>

    <text x="652" y="240" font-size="11" fill="#eafff6" text-anchor="middle">Bãi chứa segment</text>
    <text x="652" y="255" font-size="11" fill="#eafff6" text-anchor="middle">Segment storage yard</text>
    <text x="652" y="275" font-size="11" fill="#eafff6" text-anchor="middle">Lắp đặt theo tiến độ TBM</text>
  </g>

  <!-- feedback: progress tracking / early warning -->
  <path d="M652,300 C652,335 365,335 365,260" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
  <text x="500" y="332" font-size="11" fill="#5a6270" text-anchor="middle">Theo dõi tiến độ &amp; cảnh báo sớm / progress tracking &amp; early warning</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6270"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <text x="400" y="405" font-size="14" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Chuỗi cung ứng vật tư thi công metro / Metro construction supply chain
  </text>
</svg>
