<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- main panel -->
  <rect x="30" y="60" width="740" height="330" rx="8" fill="#ffffff" stroke="#d8dde1" stroke-width="2"/>

  <!-- OCC (control center) -->
  <rect x="610" y="80" width="130" height="56" rx="6" fill="#eef1f0" stroke="#5a6270" stroke-width="2"/>
  <text x="675" y="103" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Trung tâm điều hành</text>
  <text x="675" y="118" font-size="11" fill="#5a6270" text-anchor="middle">OCC / Control Center</text>

  <!-- Zone controller -->
  <rect x="610" y="170" width="130" height="56" rx="6" fill="#eef1f0" stroke="#5a6270" stroke-width="2"/>
  <text x="675" y="193" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Bộ điều khiển khu vực</text>
  <text x="675" y="208" font-size="11" fill="#5a6270" text-anchor="middle">Zone Controller</text>

  <!-- link OCC - Zone controller -->
  <line x1="675" y1="136" x2="675" y2="170" stroke="#5a6270" stroke-width="2"/>

  <!-- radio network cable along tunnel ceiling -->
  <line x1="60" y1="140" x2="600" y2="140" stroke="#8a8f98" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="600" y1="140" x2="610" y2="198" stroke="#8a8f98" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="330" y="132" font-size="11" fill="#5a6270" text-anchor="middle">cáp truyền dẫn vô tuyến (leaky feeder) / radio transmission cable</text>

  <!-- track bed -->
  <rect x="60" y="330" width="650" height="18" fill="#d8dde1" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="385" y="368" font-size="11" fill="#5a6270" text-anchor="middle">đường ray / running rails</text>

  <!-- balise marker between trains -->
  <rect x="408" y="320" width="14" height="10" fill="#1a1d23"/>
  <text x="415" y="310" font-size="10" fill="#1a1d23" text-anchor="middle">balise</text>

  <!-- moving block envelope - Train A -->
  <rect x="95" y="225" width="200" height="110" rx="10" fill="none" stroke="#0a5c4a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="195" y="216" font-size="11" fill="#0a5c4a" text-anchor="middle" font-weight="600">khối di động / moving block</text>

  <!-- Train A -->
  <rect x="120" y="268" width="150" height="56" rx="8" fill="#eef1f0" stroke="#5a6270" stroke-width="2"/>
  <rect x="132" y="280" width="30" height="20" rx="3" fill="#bcd8ce"/>
  <rect x="170" y="280" width="30" height="20" rx="3" fill="#bcd8ce"/>
  <rect x="208" y="280" width="30" height="20" rx="3" fill="#bcd8ce"/>

  <!-- antenna train A -->
  <line x1="195" y1="268" x2="195" y2="245" stroke="#1a1d23" stroke-width="2"/>
  <path d="M185,250 l10,-10 l10,10" stroke="#0a5c4a" stroke-width="2" fill="none"/>
  <path d="M190,243 l5,-6 l5,6" stroke="#0a5c4a" stroke-width="1.5" fill="none"/>
  <line x1="195" y1="233" x2="195" y2="140" stroke="#0a5c4a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- moving block envelope - Train B -->
  <rect x="455" y="225" width="200" height="110" rx="10" fill="none" stroke="#0a5c4a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="555" y="216" font-size="11" fill="#0a5c4a" text-anchor="middle" font-weight="600">khối di động / moving block</text>

  <!-- Train B -->
  <rect x="480" y="268" width="150" height="56" rx="8" fill="#eef1f0" stroke="#5a6270" stroke-width="2"/>
  <rect x="492" y="280" width="30" height="20" rx="3" fill="#bcd8ce"/>
  <rect x="530" y="280" width="30" height="20" rx="3" fill="#bcd8ce"/>
  <rect x="568" y="280" width="30" height="20" rx="3" fill="#bcd8ce"/>

  <!-- antenna train B -->
  <line x1="555" y1="268" x2="555" y2="245" stroke="#1a1d23" stroke-width="2"/>
  <path d="M545,250 l10,-10 l10,10" stroke="#0a5c4a" stroke-width="2" fill="none"/>
  <path d="M550,243 l5,-6 l5,6" stroke="#0a5c4a" stroke-width="1.5" fill="none"/>
  <line x1="555" y1="233" x2="555" y2="140" stroke="#0a5c4a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- minimum safe separation marker between envelopes -->
  <line x1="295" y1="280" x2="455" y2="280" stroke="#1a1d23" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="375" y="272" font-size="10" fill="#1a1d23" text-anchor="middle">khoảng cách an toàn tối thiểu</text>
  <text x="375" y="290" font-size="10" fill="#1a1d23" text-anchor="middle">min. safe separation</text>

  <!-- travel direction arrow -->
  <line x1="650" y1="358" x2="700" y2="358" stroke="#1a1d23" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="675" y="380" font-size="10" fill="#1a1d23" text-anchor="middle">hướng chạy tàu / direction of travel</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text x="400" y="35" font-size="16" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Hệ thống tín hiệu CBTC: Nguyên lý khối di động
  </text>
  <text x="400" y="416" font-size="12" fill="#5a6270" text-anchor="middle">
    CBTC signaling: the moving-block principle
  </text>
</svg>
