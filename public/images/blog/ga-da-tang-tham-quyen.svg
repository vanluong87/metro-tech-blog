<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- ground -->
  <rect x="0" y="80" width="800" height="370" fill="#e2e8e1"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#9fb09c" stroke-width="2"/>

  <!-- street level -->
  <rect x="0" y="60" width="800" height="20" fill="#3a3f47"/>
  <text x="20" y="52" font-size="13" fill="#1a1d23">mặt đường / street level</text>

  <!-- diaphragm walls, shared by station and commercial tower -->
  <rect x="110" y="80" width="16" height="330" fill="#5a6270"/>
  <rect x="674" y="80" width="16" height="330" fill="#5a6270"/>
  <text x="95" y="72" font-size="11" fill="#5a6270" text-anchor="end">tường vây dùng chung</text>
  <text x="95" y="86" font-size="11" fill="#5a6270" text-anchor="end">shared wall</text>

  <!-- commercial tower footing above, left block -->
  <rect x="150" y="30" width="170" height="30" fill="#8a8f98"/>
  <text x="235" y="50" font-size="11" fill="#ffffff" text-anchor="middle">Tòa nhà thương mại / commercial tower</text>

  <!-- B1 retail basement -->
  <rect x="126" y="100" width="548" height="60" fill="#d8dde1" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="400" y="134" font-size="13" fill="#3a3f47" text-anchor="middle" font-weight="600">Tầng hầm thương mại B1 / Commercial basement B1</text>

  <!-- connecting corridor (fire-separated boundary, dashed) -->
  <g stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="6 5" fill="none">
    <rect x="330" y="160" width="140" height="50"/>
  </g>
  <text x="400" y="182" font-size="11" fill="#5a6270" text-anchor="middle">hành lang kết nối</text>
  <text x="400" y="196" font-size="11" fill="#5a6270" text-anchor="middle">connecting corridor</text>

  <!-- station concourse, highlighted as key connecting element -->
  <rect x="126" y="210" width="548" height="60" fill="#0a5c4a"/>
  <text x="400" y="235" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Sảnh ga kết nối thương mại</text>
  <text x="400" y="251" font-size="11" fill="#d8f0e8" text-anchor="middle">Station concourse linked to retail</text>

  <!-- fire/life-safety boundary marker -->
  <line x1="126" y1="270" x2="674" y2="270" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="684" y="274" font-size="10" fill="#c0392b">ranh giới PCCC / fire boundary</text>

  <!-- B2: parking / mechanical shared level -->
  <rect x="126" y="280" width="548" height="50" fill="#d8dde1" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="400" y="310" font-size="12" fill="#3a3f47" text-anchor="middle">Tầng hầm B2 (bãi đỗ / kỹ thuật) · B2 (parking / M&amp;E)</text>

  <!-- platform level -->
  <rect x="126" y="340" width="548" height="60" fill="#3a8a72"/>
  <text x="400" y="365" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Tầng ke ga / Platform level</text>

  <!-- simple train shape on platform -->
  <rect x="300" y="372" width="200" height="18" rx="4" fill="#245c4c"/>
  <rect x="310" y="376" width="20" height="10" fill="#cfe9df"/>
  <rect x="340" y="376" width="20" height="10" fill="#cfe9df"/>
  <rect x="370" y="376" width="20" height="10" fill="#cfe9df"/>

  <!-- base slab -->
  <rect x="126" y="400" width="548" height="14" fill="#245c4c"/>
  <text x="400" y="434" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Sàn đáy / base slab</text>

  <text x="400" y="22" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Ga metro đa tầng kết nối trung tâm thương mại / Multi-level station linked to commercial center
  </text>
</svg>
