<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- tunnel cross-section panel -->
  <rect x="30" y="70" width="740" height="260" rx="8" fill="#ffffff" stroke="#d8dde1"/>

  <!-- tunnel bore -->
  <path d="M60,300 L60,180 Q60,110 150,110 L650,110 Q740,110 740,180 L740,300 Z"
        fill="#e2e8e1" stroke="#8a8f98" stroke-width="2"/>

  <!-- existing track (old line) -->
  <line x1="90" y1="280" x2="710" y2="280" stroke="#8a8f98" stroke-width="6"/>
  <text x="100" y="265" font-size="12" fill="#5a6270">đường ray hiện hữu / existing track</text>

  <!-- old signal relay box being swapped -->
  <rect x="150" y="150" width="60" height="70" fill="#8a8f98" opacity="0.5" stroke="#5a6270" stroke-width="1.5"/>
  <text x="180" y="145" font-size="11" fill="#5a6270" text-anchor="middle">tín hiệu cũ</text>
  <text x="180" y="233" font-size="10" fill="#5a6270" text-anchor="middle">legacy signal</text>

  <!-- arrow old -> new -->
  <line x1="222" y1="185" x2="268" y2="185" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrowU)"/>

  <!-- new CBTC cabinet being installed -->
  <rect x="280" y="150" width="60" height="70" fill="#0a5c4a" stroke="#06392e" stroke-width="1.5"/>
  <text x="310" y="145" font-size="11" fill="#0a5c4a" text-anchor="middle" font-weight="600">CBTC mới</text>
  <text x="310" y="233" font-size="10" fill="#0a5c4a" text-anchor="middle">new CBTC</text>

  <!-- worker figures (simple) -->
  <g fill="#3a3f47">
    <circle cx="420" cy="245" r="9"/>
    <rect x="412" y="254" width="16" height="28" rx="4"/>
    <circle cx="470" cy="245" r="9"/>
    <rect x="462" y="254" width="16" height="28" rx="4"/>
  </g>
  <text x="445" y="310" font-size="12" fill="#5a6270" text-anchor="middle">đội thi công ban đêm / night work crew</text>

  <!-- new elevator shaft being added -->
  <rect x="560" y="130" width="90" height="150" fill="#ffffff" stroke="#0a5c4a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="605" y="122" font-size="11" fill="#0a5c4a" text-anchor="middle" font-weight="600">thang máy mới</text>
  <rect x="580" y="170" width="50" height="90" fill="#0a5c4a" opacity="0.85"/>
  <text x="605" y="300" font-size="10" fill="#0a5c4a" text-anchor="middle">new elevator (accessibility)</text>

  <!-- clock / limited window indicator -->
  <circle cx="690" cy="95" r="0"/>

  <defs>
    <marker id="arrowU" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <!-- timeline bar: day service vs night maintenance window -->
  <rect x="30" y="355" width="740" height="40" rx="6" fill="#ffffff" stroke="#d8dde1"/>
  <rect x="34" y="359" width="560" height="32" fill="#d3ddd2"/>
  <rect x="594" y="359" width="172" height="32" fill="#0a5c4a"/>
  <text x="314" y="380" font-size="13" fill="#1a1d23" text-anchor="middle">Giờ khai thác bình thường / normal daytime service</text>
  <text x="680" y="380" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Cửa sổ thi công đêm / night work window</text>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Nâng cấp tuyến metro đang khai thác / Upgrading a live metro line
  </text>
  <text x="400" y="430" font-size="12" fill="#5a6270" text-anchor="middle">
    Thay thế hệ thống &amp; nâng cấp tiếp cận trong khung giờ ngừng tàu ngắn / system replacement &amp; accessibility upgrades within short non-operating windows
  </text>
</svg>
