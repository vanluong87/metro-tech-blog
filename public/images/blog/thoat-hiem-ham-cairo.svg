<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- ground -->
  <rect x="0" y="0" width="800" height="90" fill="#e7ebe6"/>
  <line x1="0" y1="90" x2="800" y2="90" stroke="#9fb09c" stroke-width="2"/>

  <!-- Tunnel A (top) -->
  <rect x="40" y="120" width="720" height="90" rx="45" fill="#ffffff" stroke="#5a6270" stroke-width="2"/>
  <text x="60" y="110" font-size="13" fill="#5a6270" font-weight="600">Hầm A (hướng đi) / Tunnel A (outbound)</text>

  <!-- track in tunnel A -->
  <line x1="55" y1="165" x2="785" y2="165" stroke="#8a8f98" stroke-width="3"/>
  <line x1="55" y1="172" x2="785" y2="172" stroke="#8a8f98" stroke-width="3"/>

  <!-- walkway tunnel A -->
  <rect x="55" y="130" width="730" height="14" fill="#d8dde1"/>

  <!-- smoke/fire icon in tunnel A -->
  <g>
    <circle cx="300" cy="160" r="26" fill="#c0392b" opacity="0.15"/>
    <path d="M292,172 q6,-20 0,-28 q10,6 10,16 q8,-4 6,-14 q10,8 6,22 q-4,10 -22,4 z" fill="#c0392b"/>
    <text x="300" y="205" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="600">sự cố / incident</text>
  </g>

  <!-- Tunnel B (bottom) -->
  <rect x="40" y="300" width="720" height="90" rx="45" fill="#ffffff" stroke="#5a6270" stroke-width="2"/>
  <text x="60" y="412" font-size="13" fill="#5a6270" font-weight="600">Hầm B (hướng về) / Tunnel B (inbound) — an toàn / clear</text>

  <!-- track in tunnel B -->
  <line x1="55" y1="333" x2="785" y2="333" stroke="#8a8f98" stroke-width="3"/>
  <line x1="55" y1="340" x2="785" y2="340" stroke="#8a8f98" stroke-width="3"/>

  <!-- walkway tunnel B -->
  <rect x="55" y="356" width="730" height="14" fill="#d8dde1"/>

  <!-- Cross-passage connecting A and B -->
  <rect x="440" y="210" width="60" height="90" fill="#0a5c4a"/>
  <rect x="448" y="222" width="44" height="18" fill="#eafff6" opacity="0.85"/>
  <rect x="448" y="262" width="44" height="18" fill="#eafff6" opacity="0.85"/>
  <text x="470" y="250" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">cửa</text>
  <text x="470" y="260" font-size="9" fill="#ffffff" text-anchor="middle">chịu lửa</text>

  <!-- escape direction arrows -->
  <line x1="340" y1="165" x2="460" y2="165" stroke="#1a1d23" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowE)"/>
  <line x1="470" y1="210" x2="470" y2="300" stroke="#1a1d23" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowE)"/>
  <line x1="470" y1="333" x2="620" y2="333" stroke="#1a1d23" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowE)"/>

  <defs>
    <marker id="arrowE" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <!-- spacing label -->
  <text x="700" y="245" font-size="11" fill="#5a6270" text-anchor="middle">khoảng cách</text>
  <text x="700" y="258" font-size="11" fill="#5a6270" text-anchor="middle">~200-300m</text>

  <text x="400" y="30" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Hành lang nối ngang giữa hai hầm đơn tuyến / Cross-passage between twin bored tunnels
  </text>
  <text x="400" y="50" font-size="12" fill="#5a6270" text-anchor="middle">
    Lối thoát hiểm khẩn cấp trong hầm metro / Emergency escape route in metro tunnels
  </text>
</svg>
