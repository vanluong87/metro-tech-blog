<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- ground surface -->
  <rect x="0" y="0" width="800" height="70" fill="#e7ebe6"/>
  <line x1="0" y1="70" x2="800" y2="70" stroke="#9fb09c" stroke-width="2"/>
  <g stroke="#9fb09c" stroke-width="2">
    <line x1="40" y1="70" x2="30" y2="55"/>
    <line x1="90" y1="70" x2="80" y2="55"/>
    <line x1="140" y1="70" x2="130" y2="55"/>
    <line x1="660" y1="70" x2="650" y2="55"/>
    <line x1="710" y1="70" x2="700" y2="55"/>
    <line x1="760" y1="70" x2="750" y2="55"/>
  </g>
  <text x="16" y="45" font-size="13" fill="#3f4a44">mặt đất / ground surface</text>

  <!-- soil layers -->
  <rect x="0" y="70" width="800" height="60" fill="#e3ddd2"/>
  <text x="590" y="105" font-size="12" fill="#5a6270">lớp đất lấp / fill</text>

  <rect x="0" y="130" width="800" height="110" fill="#d8dde1"/>
  <text x="560" y="190" font-size="12" fill="#5a6270">sét mềm, bùn / soft clay &amp; mud</text>

  <!-- groundwater table -->
  <path d="M0,150 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"
        fill="none" stroke="#7fa8d9" stroke-width="2" opacity="0.8"/>
  <text x="16" y="145" font-size="12" fill="#4d6b96">mực nước ngầm / water table</text>

  <rect x="0" y="240" width="800" height="90" fill="#c9d2c8"/>
  <text x="540" y="290" font-size="12" fill="#5a6270">sét cứng xen kẹp / stiff clay interbeds</text>

  <rect x="0" y="330" width="800" height="120" fill="#8a8f98" opacity="0.55"/>
  <text x="560" y="395" font-size="12" fill="#3a3f45">cát chịu lực / bearing sand layer</text>

  <!-- boreholes -->
  <g>
    <!-- borehole 1 -->
    <line x1="150" y1="70" x2="150" y2="400" stroke="#5a6270" stroke-width="4"/>
    <circle cx="150" cy="70" r="6" fill="#0a5c4a"/>
    <text x="150" y="55" font-size="12" fill="#1a1d23" text-anchor="middle">BH-1</text>

    <!-- borehole 2 -->
    <line x1="330" y1="70" x2="330" y2="400" stroke="#5a6270" stroke-width="4"/>
    <circle cx="330" cy="70" r="6" fill="#0a5c4a"/>
    <text x="330" y="55" font-size="12" fill="#1a1d23" text-anchor="middle">BH-2</text>

    <!-- borehole 3 (SPT sampling highlighted) -->
    <line x1="510" y1="70" x2="510" y2="400" stroke="#0a5c4a" stroke-width="5"/>
    <circle cx="510" cy="70" r="7" fill="#0a5c4a"/>
    <text x="510" y="55" font-size="12" fill="#0a5c4a" text-anchor="middle" font-weight="600">BH-3</text>
    <!-- sample markers along BH-3 -->
    <g fill="#0a5c4a">
      <rect x="503" y="140" width="14" height="10"/>
      <rect x="503" y="220" width="14" height="10"/>
      <rect x="503" y="300" width="14" height="10"/>
      <rect x="503" y="370" width="14" height="10"/>
    </g>
    <text x="530" y="145" font-size="11" fill="#3a3f45">mẫu SPT/CPT</text>

    <!-- borehole 4 -->
    <line x1="690" y1="70" x2="690" y2="400" stroke="#5a6270" stroke-width="4"/>
    <circle cx="690" cy="70" r="6" fill="#0a5c4a"/>
    <text x="690" y="55" font-size="12" fill="#1a1d23" text-anchor="middle">BH-4</text>
  </g>

  <!-- inferred alignment / tunnel risk zone dashed -->
  <path d="M0,265 q400,-20 800,10" fill="none" stroke="#1a1d23" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="400" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" opacity="0.75">tuyến hầm dự kiến / planned tunnel alignment</text>

  <!-- monitoring point -->
  <g>
    <circle cx="330" cy="70" r="14" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.8"/>
    <text x="380" y="30" font-size="11" fill="#8a2f26" text-anchor="middle">điểm quan trắc lún</text>
    <text x="380" y="43" font-size="11" fill="#8a2f26" text-anchor="middle">settlement monitoring point</text>
  </g>

  <text x="400" y="430" font-size="14" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Sơ đồ khảo sát địa chất trước thi công / Pre-construction geotechnical investigation
  </text>
</svg>
