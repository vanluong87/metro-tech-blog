<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- ground layers -->
  <rect x="0" y="0" width="800" height="150" fill="#eef1ef"/>
  <rect x="0" y="150" width="800" height="300" fill="#dfe6de"/>

  <!-- ground surface line -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#9fb09c" stroke-width="2"/>

  <!-- buildings on surface -->
  <g>
    <rect x="130" y="90" width="90" height="60" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <rect x="145" y="105" width="15" height="15" fill="#d8dde1"/>
    <rect x="170" y="105" width="15" height="15" fill="#d8dde1"/>
    <rect x="145" y="128" width="15" height="15" fill="#d8dde1"/>
    <rect x="170" y="128" width="15" height="15" fill="#d8dde1"/>
    <text x="175" y="78" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">nhà dân / housing</text>
  </g>

  <g>
    <rect x="560" y="60" width="110" height="90" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <rect x="578" y="78" width="16" height="16" fill="#d8dde1"/>
    <rect x="605" y="78" width="16" height="16" fill="#d8dde1"/>
    <rect x="632" y="78" width="16" height="16" fill="#d8dde1"/>
    <rect x="578" y="105" width="16" height="16" fill="#d8dde1"/>
    <rect x="605" y="105" width="16" height="16" fill="#d8dde1"/>
    <rect x="632" y="105" width="16" height="16" fill="#d8dde1"/>
    <text x="615" y="48" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">phòng hòa nhạc / concert hall</text>
  </g>

  <!-- bedrock hatching -->
  <g stroke="#b9c2b7" stroke-width="1.5" opacity="0.8">
    <line x1="0" y1="170" x2="30" y2="150"/>
    <line x1="40" y1="190" x2="80" y2="150"/>
    <line x1="90" y1="210" x2="140" y2="160"/>
    <line x1="240" y1="180" x2="280" y2="150"/>
    <line x1="300" y1="210" x2="350" y2="160"/>
    <line x1="700" y1="180" x2="740" y2="150"/>
    <line x1="750" y1="210" x2="790" y2="160"/>
    <line x1="420" y1="400" x2="460" y2="360"/>
    <line x1="480" y1="420" x2="520" y2="380"/>
  </g>
  <text x="16" y="440" font-size="13" fill="#5a6270">nền đá gốc / bedrock</text>

  <!-- tunnel -->
  <circle cx="350" cy="300" r="55" fill="#ffffff" stroke="#5a6270" stroke-width="3"/>
  <rect x="320" y="290" width="60" height="20" fill="#5a6270"/>
  <line x1="320" y1="300" x2="380" y2="300" stroke="#0a5c4a" stroke-width="4"/>
  <text x="350" y="370" font-size="13" fill="#5a6270" text-anchor="middle">hầm metro / metro tunnel</text>

  <!-- resilient fastening detail -->
  <rect x="325" y="298" width="50" height="6" fill="#0a5c4a" opacity="0.6"/>
  <text x="350" y="285" font-size="11" fill="#0a5c4a" text-anchor="middle" font-weight="600">đệm đàn hồi / resilient pad</text>

  <!-- vibration wave paths (dashed arcs from tunnel upward) -->
  <g fill="none" stroke="#0a5c4a" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.85">
    <path d="M345,255 Q280,180 175,150"/>
    <path d="M365,255 Q480,170 615,150"/>
  </g>
  <circle cx="345" cy="255" r="4" fill="#0a5c4a"/>
  <circle cx="365" cy="255" r="4" fill="#0a5c4a"/>

  <text x="230" y="195" font-size="12" fill="#0a5c4a" font-weight="600" transform="rotate(-18 230 195)">rung chấn truyền qua đá / ground-borne vibration</text>

  <!-- floating slab track illustration, second tunnel section -->
  <circle cx="530" cy="340" r="50" fill="#ffffff" stroke="#8a8f98" stroke-width="3"/>
  <rect x="503" y="330" width="54" height="10" fill="#8a8f98"/>
  <g stroke="#0a5c4a" stroke-width="3">
    <line x1="508" y1="342" x2="513" y2="350"/>
    <line x1="522" y1="342" x2="527" y2="350"/>
    <line x1="536" y1="342" x2="541" y2="350"/>
    <line x1="550" y1="342" x2="555" y2="350"/>
  </g>
  <rect x="505" y="350" width="50" height="6" fill="#5a6270"/>
  <line x1="505" y1="340" x2="555" y2="340" stroke="#0a5c4a" stroke-width="4"/>
  <text x="530" y="405" font-size="12" fill="#5a6270" text-anchor="middle">tà vẹt nổi / floating slab track</text>

  <defs>
    <marker id="arrowv" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0a5c4a"/>
    </marker>
  </defs>

  <text x="400" y="30" font-size="16" fill="#1a1d23" text-anchor="middle" font-weight="700">
    Kiểm soát rung chấn từ metro ngầm lên khu dân cư / Vibration control from underground metro to surface buildings
  </text>
</svg>
