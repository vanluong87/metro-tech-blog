<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="32" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Bàn giao dự án &amp; khai thác thương mại giai đoạn đầu / Handover &amp; initial commercial operation
  </text>

  <!-- stage sequence -->
  <g>
    <!-- Stage 1 -->
    <rect x="20" y="80" width="165" height="120" rx="8" fill="#ffffff" stroke="#d8dde1"/>
    <circle cx="102" cy="108" r="14" fill="#8a8f98"/>
    <text x="102" y="113" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
    <text x="102" y="150" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Chạy thử kỹ thuật</text>
    <text x="102" y="167" font-size="11" fill="#5a6270" text-anchor="middle">Trial running</text>
    <text x="102" y="185" font-size="10" fill="#8a8f98" text-anchor="middle">(không khách)</text>

    <!-- Stage 2 -->
    <rect x="215" y="80" width="165" height="120" rx="8" fill="#ffffff" stroke="#d8dde1"/>
    <circle cx="297" cy="108" r="14" fill="#8a8f98"/>
    <text x="297" y="113" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
    <text x="297" y="150" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Chạy thử khai thác</text>
    <text x="297" y="167" font-size="11" fill="#5a6270" text-anchor="middle">Trial operation</text>
    <text x="297" y="185" font-size="10" fill="#8a8f98" text-anchor="middle">(mô phỏng lịch chạy)</text>

    <!-- Stage 3 - key, accent -->
    <rect x="410" y="74" width="175" height="132" rx="8" fill="#0a5c4a" stroke="#0a5c4a"/>
    <circle cx="497" cy="104" r="15" fill="#ffffff"/>
    <text x="497" y="109" font-size="13" fill="#0a5c4a" text-anchor="middle" font-weight="700">3</text>
    <text x="497" y="150" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Bàn giao &amp; nghiệm thu</text>
    <text x="497" y="168" font-size="11" fill="#dfe9e5" text-anchor="middle">Handover &amp; acceptance</text>
    <text x="497" y="188" font-size="10" fill="#bcd8cc" text-anchor="middle">cấp phép khai thác</text>

    <!-- Stage 4 -->
    <rect x="615" y="80" width="165" height="120" rx="8" fill="#ffffff" stroke="#d8dde1"/>
    <circle cx="697" cy="108" r="14" fill="#8a8f98"/>
    <text x="697" y="113" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">4</text>
    <text x="697" y="150" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Khai thác thương mại</text>
    <text x="697" y="167" font-size="11" fill="#5a6270" text-anchor="middle">Commercial service</text>
    <text x="697" y="185" font-size="10" fill="#8a8f98" text-anchor="middle">(tần suất giảm, tăng dần)</text>

    <!-- arrows -->
    <g stroke="#1a1d23" stroke-width="3" fill="none">
      <line x1="187" y1="140" x2="212" y2="140" marker-end="url(#arrowBG)"/>
      <line x1="382" y1="140" x2="407" y2="140" marker-end="url(#arrowBG)"/>
      <line x1="587" y1="140" x2="612" y2="140" marker-end="url(#arrowBG)"/>
    </g>
    <defs>
      <marker id="arrowBG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
      </marker>
    </defs>
  </g>

  <!-- ramp-up bar chart below -->
  <g>
    <text x="400" y="240" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Tần suất tàu tăng dần sau khai trương / Service frequency ramps up after opening</text>

    <rect x="140" y="0" width="0" height="0" fill="none"/>
    <!-- baseline -->
    <line x1="140" y1="400" x2="660" y2="400" stroke="#8a8f98" stroke-width="1.5"/>

    <rect x="170" y="340" width="70" height="60" fill="#8a8f98"/>
    <text x="205" y="415" font-size="11" fill="#5a6270" text-anchor="middle">Tuần 1</text>
    <text x="205" y="428" font-size="10" fill="#8a8f98" text-anchor="middle">Week 1</text>

    <rect x="280" y="305" width="70" height="95" fill="#8a8f98"/>
    <text x="315" y="415" font-size="11" fill="#5a6270" text-anchor="middle">Tuần 2-4</text>
    <text x="315" y="428" font-size="10" fill="#8a8f98" text-anchor="middle">Weeks 2-4</text>

    <rect x="390" y="260" width="70" height="140" fill="#3a8a72"/>
    <text x="425" y="415" font-size="11" fill="#5a6270" text-anchor="middle">Tháng 2-3</text>
    <text x="425" y="428" font-size="10" fill="#8a8f98" text-anchor="middle">Months 2-3</text>

    <rect x="500" y="215" width="70" height="185" fill="#0a5c4a"/>
    <text x="535" y="415" font-size="11" fill="#5a6270" text-anchor="middle">Khai thác đầy đủ</text>
    <text x="535" y="428" font-size="10" fill="#8a8f98" text-anchor="middle">Full service</text>
  </g>
</svg>
