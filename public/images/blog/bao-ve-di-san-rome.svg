<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- sky / ground -->
  <rect x="0" y="120" width="800" height="330" fill="#e2e8e1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#9fb09c" stroke-width="2"/>

  <!-- heritage building on the surface -->
  <g>
    <rect x="130" y="95" width="160" height="25" fill="#8a8f98"/>
    <rect x="140" y="55" width="12" height="40" fill="#8a8f98"/>
    <rect x="166" y="55" width="12" height="40" fill="#8a8f98"/>
    <rect x="192" y="55" width="12" height="40" fill="#8a8f98"/>
    <rect x="218" y="55" width="12" height="40" fill="#8a8f98"/>
    <rect x="244" y="55" width="12" height="40" fill="#8a8f98"/>
    <rect x="266" y="55" width="12" height="40" fill="#8a8f98"/>
    <path d="M130,55 L210,30 L290,55 Z" fill="#5a6270"/>
    <text x="210" y="20" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Công trình di sản / Heritage building</text>
  </g>

  <!-- monitoring sensors on building -->
  <g fill="#0a5c4a">
    <circle cx="152" cy="95" r="4"/>
    <circle cx="268" cy="95" r="4"/>
    <circle cx="210" cy="118" r="4"/>
  </g>
  <line x1="152" y1="95" x2="100" y2="150" stroke="#0a5c4a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="268" y1="95" x2="330" y2="150" stroke="#0a5c4a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="60" y="150" font-size="11" fill="#0a5c4a" text-anchor="end">mốc quan trắc</text>
  <text x="60" y="163" font-size="11" fill="#0a5c4a" text-anchor="end">monitoring point</text>

  <!-- archaeological layer -->
  <g>
    <rect x="320" y="128" width="160" height="22" fill="#c9a66b" opacity="0.8"/>
    <text x="400" y="143" font-size="10" fill="#5a3d1f" text-anchor="middle">tầng khảo cổ / archaeological layer</text>
  </g>

  <!-- settlement trough (dashed curve) above tunnel -->
  <path d="M60,122 C 220,122 290,158 400,158 C 510,158 580,122 740,122"
        fill="none" stroke="#5a6270" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="560" y="112" font-size="12" fill="#5a6270" text-anchor="middle">đường cong lún / settlement trough</text>

  <!-- compensation grouting zone between tunnel and foundations -->
  <g fill="#0a5c4a" opacity="0.55">
    <circle cx="330" cy="200" r="4"/>
    <circle cx="350" cy="210" r="4"/>
    <circle cx="370" cy="195" r="4"/>
    <circle cx="390" cy="212" r="4"/>
    <circle cx="410" cy="198" r="4"/>
    <circle cx="430" cy="213" r="4"/>
    <circle cx="450" cy="197" r="4"/>
    <circle cx="470" cy="208" r="4"/>
  </g>
  <text x="400" y="235" font-size="11" fill="#0a5c4a" text-anchor="middle" font-weight="600">grouting bù lún / compensation grouting</text>

  <!-- tunnel cross-section -->
  <circle cx="400" cy="330" r="70" fill="#ffffff" stroke="#5a6270" stroke-width="2.5"/>
  <circle cx="400" cy="330" r="48" fill="none" stroke="#0a5c4a" stroke-width="5"/>
  <text x="400" y="334" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Hầm metro</text>
  <text x="400" y="349" font-size="11" fill="#5a6270" text-anchor="middle">Metro tunnel</text>

  <!-- influence zone boundary lines -->
  <line x1="230" y1="150" x2="330" y2="282" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="570" y1="150" x2="470" y2="282" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="620" y="270" font-size="11" fill="#8a8f98" text-anchor="start">vùng ảnh hưởng</text>
  <text x="620" y="283" font-size="11" fill="#8a8f98" text-anchor="start">zone of influence</text>

  <text x="400" y="420" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Kiểm soát lún khi thi công ngầm dưới công trình di sản
  </text>
  <text x="400" y="438" font-size="12" fill="#5a6270" text-anchor="middle">
    Settlement control beneath heritage structures
  </text>
</svg>
