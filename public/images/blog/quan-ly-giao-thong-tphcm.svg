<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- road surface -->
  <rect x="0" y="150" width="800" height="180" fill="#dde2e0"/>

  <!-- original lane markings (dashed, full width) faded to show original road -->
  <line x1="0" y1="240" x2="800" y2="240" stroke="#c3c9c6" stroke-width="2" stroke-dasharray="14 10"/>

  <!-- site hoarding block occupying part of the roadway -->
  <rect x="300" y="150" width="200" height="110" fill="#8a8f98"/>
  <g stroke="#5a6270" stroke-width="2">
    <line x1="310" y1="150" x2="310" y2="260"/>
    <line x1="330" y1="150" x2="330" y2="260"/>
    <line x1="350" y1="150" x2="350" y2="260"/>
    <line x1="370" y1="150" x2="370" y2="260"/>
    <line x1="390" y1="150" x2="390" y2="260"/>
    <line x1="410" y1="150" x2="410" y2="260"/>
    <line x1="430" y1="150" x2="430" y2="260"/>
    <line x1="450" y1="150" x2="450" y2="260"/>
    <line x1="470" y1="150" x2="470" y2="260"/>
    <line x1="490" y1="150" x2="490" y2="260"/>
  </g>
  <!-- shaft opening inside hoarding -->
  <rect x="355" y="175" width="90" height="60" rx="4" fill="#1a1d23"/>
  <text x="400" y="209" font-size="11" fill="#ffffff" text-anchor="middle">giếng thi công</text>
  <text x="400" y="222" font-size="10" fill="#c3c9c6" text-anchor="middle">shaft</text>

  <!-- diverted traffic lanes: green accent markers, curving around hoarding -->
  <path d="M0,300 C150,300 250,300 300,300 L500,300 C560,300 650,300 800,300"
        fill="none" stroke="#0a5c4a" stroke-width="6" stroke-linecap="round"/>
  <path d="M0,300 C150,300 250,300 300,300 L500,300 C560,300 650,300 800,300"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- arrow heads showing diverted direction -->
  <path d="M120,300 l14,-7 v14 z" fill="#0a5c4a"/>
  <path d="M650,300 l14,-7 v14 z" fill="#0a5c4a"/>

  <!-- pedestrian covered walkway along hoarding -->
  <rect x="300" y="262" width="200" height="18" fill="#e6c84a"/>
  <text x="400" y="296" font-size="11" fill="#5a6270" text-anchor="middle">lối đi bộ có mái che</text>
  <text x="400" y="309" font-size="10" fill="#8a8f98" text-anchor="middle">covered pedestrian walkway</text>

  <!-- simple vehicle glyphs on diverted lane -->
  <g fill="#3a3f47">
    <rect x="70" y="290" width="26" height="12" rx="2"/>
    <rect x="700" y="290" width="26" height="12" rx="2"/>
    <rect x="200" y="315" width="26" height="12" rx="2"/>
    <rect x="560" y="315" width="26" height="12" rx="2"/>
  </g>

  <!-- original road edges -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#9fb09c" stroke-width="2"/>
  <line x1="0" y1="330" x2="800" y2="330" stroke="#9fb09c" stroke-width="2"/>

  <!-- buildings along street, top -->
  <g fill="#d8dde1" stroke="#c3c9c6">
    <rect x="20" y="60" width="70" height="80"/>
    <rect x="110" y="40" width="60" height="100"/>
    <rect x="630" y="50" width="65" height="90"/>
    <rect x="710" y="65" width="70" height="75"/>
  </g>

  <!-- labels -->
  <text x="400" y="30" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Phân luồng giao thông quanh công trường ngầm / Traffic diversion around an underground work site
  </text>

  <text x="400" y="372" font-size="12" fill="#5a6270" text-anchor="middle">Hàng rào công trường / Site hoarding</text>
  <text x="400" y="390" font-size="12" fill="#5a6270" text-anchor="middle">Làn xe tạm chuyển hướng / Temporary diverted traffic lane</text>
  <text x="400" y="408" font-size="12" fill="#5a6270" text-anchor="middle">Mặt đường gốc / Original road edge</text>
</svg>
