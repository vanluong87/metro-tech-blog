<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- title -->
  <text x="400" y="38" font-size="16" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Từ nhà máy đến công trường / From Factory to Site
  </text>

  <!-- step 1: Factory assembly -->
  <g>
    <rect x="30" y="90" width="150" height="150" rx="10" fill="#f3f5f4" stroke="#8a8f98" stroke-width="2"/>
    <rect x="55" y="120" width="100" height="50" rx="6" fill="#5a6270"/>
    <circle cx="75" cy="178" r="10" fill="#1a1d23"/>
    <circle cx="135" cy="178" r="10" fill="#1a1d23"/>
    <rect x="55" y="120" width="100" height="50" rx="6" fill="none" stroke="#2e333b" stroke-width="2"/>
    <text x="105" y="200" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Nhà máy</text>
    <text x="105" y="215" font-size="11" fill="#5a6270" text-anchor="middle">Factory assembly</text>
  </g>

  <!-- arrow 1 -->
  <line x1="185" y1="165" x2="225" y2="165" stroke="#8a8f98" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 2: FAT -->
  <g>
    <rect x="230" y="90" width="150" height="150" rx="10" fill="#f3f5f4" stroke="#0a5c4a" stroke-width="2"/>
    <rect x="255" y="130" width="100" height="40" rx="6" fill="#0a5c4a"/>
    <circle cx="275" cy="172" r="9" fill="#1a1d23"/>
    <circle cx="335" cy="172" r="9" fill="#1a1d23"/>
    <path d="M330,105 l12,12 l20,-24" fill="none" stroke="#0a5c4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="305" y="200" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Kiểm tra xuất xưởng</text>
    <text x="305" y="215" font-size="11" fill="#5a6270" text-anchor="middle">Factory Acceptance Test</text>
  </g>

  <!-- arrow 2 -->
  <line x1="385" y1="165" x2="425" y2="165" stroke="#8a8f98" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 3: Transport -->
  <g>
    <rect x="430" y="90" width="150" height="150" rx="10" fill="#f3f5f4" stroke="#8a8f98" stroke-width="2"/>
    <rect x="450" y="150" width="110" height="18" fill="#d8dde1" stroke="#8a8f98" stroke-width="1.5"/>
    <rect x="460" y="128" width="90" height="26" rx="4" fill="#5a6270"/>
    <circle cx="470" cy="172" r="8" fill="#1a1d23"/>
    <circle cx="500" cy="172" r="8" fill="#1a1d23"/>
    <circle cx="530" cy="172" r="8" fill="#1a1d23"/>
    <circle cx="552" cy="172" r="8" fill="#1a1d23"/>
    <line x1="450" y1="168" x2="440" y2="178" stroke="#8a8f98" stroke-width="3"/>
    <text x="505" y="200" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Vận chuyển</text>
    <text x="505" y="215" font-size="11" fill="#5a6270" text-anchor="middle">Rail / sea / road transport</text>
  </g>

  <!-- arrow 3 -->
  <line x1="585" y1="165" x2="625" y2="165" stroke="#8a8f98" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 4: Depot -->
  <g>
    <rect x="630" y="90" width="150" height="150" rx="10" fill="#f3f5f4" stroke="#0a5c4a" stroke-width="2"/>
    <rect x="650" y="110" width="110" height="60" rx="6" fill="#ffffff" stroke="#5a6270" stroke-width="2"/>
    <line x1="675" y1="110" x2="675" y2="170" stroke="#5a6270" stroke-width="2"/>
    <line x1="705" y1="110" x2="705" y2="170" stroke="#5a6270" stroke-width="2"/>
    <line x1="735" y1="110" x2="735" y2="170" stroke="#5a6270" stroke-width="2"/>
    <rect x="660" y="140" width="20" height="25" fill="#0a5c4a"/>
    <rect x="720" y="140" width="20" height="25" fill="#0a5c4a"/>
    <text x="705" y="200" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Depot</text>
    <text x="705" y="215" font-size="11" fill="#5a6270" text-anchor="middle">Site acceptance &amp; test run</text>
  </g>

  <!-- bottom note -->
  <rect x="30" y="280" width="750" height="130" rx="10" fill="#f3f5f4" stroke="#d8dde1" stroke-width="1.5"/>
  <text x="405" y="310" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Thiết kế → Sản xuất khung thân → Lắp đặt thiết bị → Kiểm tra xuất xưởng (FAT) → Vận chuyển → Nghiệm thu tại depot → Chạy thử trên tuyến
  </text>
  <text x="405" y="335" font-size="12" fill="#5a6270" text-anchor="middle">
    Design → Carbody fabrication → Equipment fit-out → Factory Acceptance Test (FAT) → Transport → Site acceptance at depot → Mainline test run
  </text>
  <text x="405" y="365" font-size="12" fill="#5a6270" text-anchor="middle">
    Tiến độ sản xuất đoàn tàu cần đồng bộ với tiến độ xây dựng depot và tuyến chính.
  </text>
  <text x="405" y="385" font-size="12" fill="#5a6270" text-anchor="middle">
    Rolling stock delivery must be synchronized with depot and mainline construction progress.
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>
</svg>
