<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Từ thiết kế cơ sở đến hồ sơ thi công tuyến metro
  </text>
  <text x="400" y="53" font-size="12" fill="#5a6270" text-anchor="middle">
    From basic design to construction-ready drawings
  </text>

  <!-- connecting line -->
  <line x1="90" y1="180" x2="710" y2="180" stroke="#d8dde1" stroke-width="3"/>

  <!-- Step 1 -->
  <g>
    <circle cx="90" cy="180" r="28" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="90" y="186" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">1</text>
    <rect x="20" y="230" width="140" height="94" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="90" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Thiết kế</text>
    <text x="90" y="272" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">cơ sở</text>
    <text x="90" y="298" font-size="10" fill="#8a8f98" text-anchor="middle">Basic</text>
    <text x="90" y="312" font-size="10" fill="#8a8f98" text-anchor="middle">design</text>
  </g>

  <!-- Step 2 - accent -->
  <g>
    <circle cx="290" cy="180" r="30" fill="#0a5c4a"/>
    <text x="290" y="187" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
    <rect x="215" y="228" width="150" height="98" rx="6" fill="#0a5c4a"/>
    <text x="290" y="253" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Thiết kế kỹ thuật</text>
    <text x="290" y="270" font-size="11" fill="#dfe9e6" text-anchor="middle">(kết cấu, hệ thống)</text>
    <text x="290" y="296" font-size="10" fill="#dfe9e6" text-anchor="middle">Engineering /</text>
    <text x="290" y="310" font-size="10" fill="#dfe9e6" text-anchor="middle">detailed design</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="500" cy="180" r="28" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="500" y="186" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">3</text>
    <rect x="425" y="230" width="150" height="94" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="500" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Thẩm tra &amp;</text>
    <text x="500" y="272" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">phê duyệt</text>
    <text x="500" y="298" font-size="10" fill="#8a8f98" text-anchor="middle">Design review</text>
    <text x="500" y="312" font-size="10" fill="#8a8f98" text-anchor="middle">&amp; approval</text>
  </g>

  <!-- Step 4 -->
  <g>
    <circle cx="710" cy="180" r="28" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="710" y="186" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">4</text>
    <rect x="640" y="230" width="140" height="94" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="710" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Hồ sơ</text>
    <text x="710" y="272" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">thi công</text>
    <text x="710" y="298" font-size="10" fill="#8a8f98" text-anchor="middle">Construction</text>
    <text x="710" y="312" font-size="10" fill="#8a8f98" text-anchor="middle">drawings</text>
  </g>

  <!-- schematic station cross-section motif at bottom -->
  <g stroke="#8a8f98" stroke-width="2" fill="none">
    <rect x="290" y="365" width="220" height="60" rx="4"/>
    <line x1="330" y1="365" x2="330" y2="425"/>
    <line x1="470" y1="365" x2="470" y2="425"/>
  </g>
  <rect x="335" y="405" width="130" height="8" fill="#5a6270"/>
  <circle cx="345" cy="416" r="5" fill="#0a5c4a"/>
  <circle cx="455" cy="416" r="5" fill="#0a5c4a"/>
  <text x="400" y="443" font-size="10" fill="#8a8f98" text-anchor="middle">mặt cắt ga / station cross-section</text>

  <line x1="90" y1="270" x2="90" y2="300" stroke="none"/>
  <!-- arrow accents between step circles -->
  <g fill="#8a8f98">
    <path d="M170,180 l14,-6 v12 z"/>
    <path d="M378,180 l14,-6 v12 z"/>
    <path d="M588,180 l14,-6 v12 z"/>
  </g>
</svg>
