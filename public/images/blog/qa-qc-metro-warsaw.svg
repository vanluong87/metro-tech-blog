<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- background panel -->
  <rect x="30" y="40" width="740" height="330" rx="10" fill="#f3f5f4" stroke="#d8dde1" stroke-width="2"/>

  <!-- Step 1: Material inspection -->
  <g>
    <rect x="60" y="80" width="190" height="230" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="155" y="108" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="700">1</text>
    <circle cx="155" cy="140" r="30" fill="none" stroke="#5a6270" stroke-width="2"/>
    <rect x="140" y="128" width="30" height="24" fill="none" stroke="#5a6270" stroke-width="2"/>
    <line x1="145" y1="134" x2="165" y2="134" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="145" y1="140" x2="165" y2="140" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="145" y1="146" x2="165" y2="146" stroke="#5a6270" stroke-width="1.5"/>
    <text x="155" y="195" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Vật liệu đầu vào</text>
    <text x="155" y="213" font-size="12" fill="#5a6270" text-anchor="middle">Incoming materials</text>
    <text x="155" y="238" font-size="11" fill="#5a6270" text-anchor="middle">Chứng chỉ · Thử mẫu lab</text>
    <text x="155" y="254" font-size="11" fill="#5a6270" text-anchor="middle">Certificates · Lab tests</text>
  </g>

  <!-- arrow 1 -->
  <line x1="250" y1="195" x2="300" y2="195" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Process monitoring -->
  <g>
    <rect x="305" y="80" width="190" height="230" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="400" y="108" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="700">2</text>
    <rect x="375" y="120" width="50" height="40" fill="none" stroke="#5a6270" stroke-width="2"/>
    <path d="M375,160 l12,-14 l10,10 l16,-20 l12,14" fill="none" stroke="#0a5c4a" stroke-width="2.5"/>
    <circle cx="400" cy="145" r="22" fill="none" stroke="#5a6270" stroke-width="1.5" opacity="0.5"/>
    <text x="400" y="195" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Giám sát thi công</text>
    <text x="400" y="213" font-size="12" fill="#5a6270" text-anchor="middle">Process monitoring</text>
    <text x="400" y="238" font-size="11" fill="#5a6270" text-anchor="middle">Method statement</text>
    <text x="400" y="254" font-size="11" fill="#5a6270" text-anchor="middle">Dung sai · Tolerances</text>
  </g>

  <!-- arrow 2 -->
  <line x1="495" y1="195" x2="545" y2="195" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Sign-off / hold point -->
  <g>
    <rect x="550" y="80" width="190" height="230" rx="8" fill="#0a5c4a" opacity="0.95"/>
    <text x="645" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
    <circle cx="645" cy="145" r="28" fill="#ffffff" opacity="0.15"/>
    <path d="M630,145 l10,12 l20,-26" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="645" y="195" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Nghiệm thu / Hold point</text>
    <text x="645" y="213" font-size="12" fill="#eafff6" text-anchor="middle">Stage sign-off</text>
    <text x="645" y="238" font-size="11" fill="#eafff6" text-anchor="middle">Ký xác nhận độc lập</text>
    <text x="645" y="254" font-size="11" fill="#eafff6" text-anchor="middle">Independent approval</text>
  </g>

  <!-- feedback loop arrow (rejected -> back to step 2) -->
  <path d="M645,312 q-120,45 -245,0" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowgray)"/>
  <text x="520" y="358" font-size="12" fill="#5a6270" text-anchor="middle">không đạt → làm lại / fail → rework</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <text x="400" y="410" font-size="14" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Ba tầng kiểm soát chất lượng QA/QC / Three-layer QA/QC control chain
  </text>
</svg>
