<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- ground layers -->
  <rect x="0" y="0" width="800" height="120" fill="#e7ebe6"/>
  <rect x="0" y="120" width="800" height="230" fill="#dfe6de"/>
  <rect x="0" y="350" width="800" height="100" fill="#d3ddd2"/>

  <!-- ground surface line + hatch (urban surface) -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#9fb09c" stroke-width="2"/>
  <g stroke="#9fb09c" stroke-width="2">
    <line x1="40" y1="120" x2="30" y2="105"/>
    <line x1="90" y1="120" x2="80" y2="105"/>
    <line x1="140" y1="120" x2="130" y2="105"/>
    <line x1="660" y1="120" x2="650" y2="105"/>
    <line x1="710" y1="120" x2="700" y2="105"/>
    <line x1="760" y1="120" x2="750" y2="105"/>
  </g>

  <!-- groundwater table (wavy) -->
  <path d="M0,300 q20,-10 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"
        fill="none" stroke="#7fa8d9" stroke-width="2" stroke-dasharray="1 0" opacity="0.7"/>
  <text x="16" y="292" font-size="13" fill="#4d6b96">mực nước ngầm / groundwater table</text>

  <!-- completed segmental lining ring (behind shield) -->
  <g stroke="#5a6270" stroke-width="2" fill="none">
    <circle cx="150" cy="250" r="70"/>
    <circle cx="150" cy="250" r="55"/>
    <line x1="150" y1="180" x2="150" y2="195"/>
    <line x1="150" y1="305" x2="150" y2="320"/>
    <line x1="80" y1="250" x2="95" y2="250"/>
    <line x1="205" y1="250" x2="220" y2="250"/>
  </g>
  <text x="150" y="345" font-size="13" fill="#5a6270" text-anchor="middle">vỏ hầm segment</text>

  <g stroke="#5a6270" stroke-width="2" fill="none">
    <circle cx="290" cy="250" r="70"/>
    <circle cx="290" cy="250" r="55"/>
  </g>

  <!-- TBM shield body -->
  <rect x="360" y="180" width="180" height="140" rx="70" fill="#0a5c4a" opacity="0.9"/>
  <text x="450" y="215" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">TBM Shield</text>
  <text x="450" y="235" font-size="12" fill="#eafff6" text-anchor="middle">(EPB / Slurry)</text>

  <!-- cutter head -->
  <circle cx="560" cy="250" r="70" fill="#0a5c4a"/>
  <g stroke="#eafff6" stroke-width="3">
    <line x1="560" y1="180" x2="560" y2="320"/>
    <line x1="490" y1="250" x2="630" y2="250"/>
    <line x1="510" y1="200" x2="610" y2="300"/>
    <line x1="510" y1="300" x2="610" y2="200"/>
  </g>
  <circle cx="560" cy="250" r="70" fill="none" stroke="#06392e" stroke-width="3"/>

  <!-- advance direction arrow -->
  <line x1="650" y1="250" x2="720" y2="250" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="685" y="235" font-size="13" fill="#1a1d23" text-anchor="middle">hướng đào</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text x="450" y="400" font-size="14" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Sơ đồ nguyên lý máy khiên đào hầm (TBM) / TBM shield tunneling principle
  </text>
</svg>
