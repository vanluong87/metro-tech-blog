<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- three-stage sequence panels -->
  <g>
    <rect x="20" y="70" width="230" height="330" rx="8" fill="#ffffff" stroke="#d8dde1"/>
    <rect x="285" y="70" width="230" height="330" rx="8" fill="#ffffff" stroke="#d8dde1"/>
    <rect x="550" y="70" width="230" height="330" rx="8" fill="#ffffff" stroke="#d8dde1"/>
  </g>

  <!-- Stage 1: top heading excavated, shotcrete + bolts on crown -->
  <g>
    <rect x="35" y="140" width="200" height="150" fill="#e2e8e1"/>
    <path d="M55,290 C55,220 95,180 135,180 C175,180 215,220 215,290 Z" fill="#f3f5f4" stroke="#8a8f98" stroke-width="1.5"/>
    <path d="M62,235 C68,205 98,186 135,186 C172,186 202,205 208,235" fill="none" stroke="#0a5c4a" stroke-width="5"/>
    <line x1="80" y1="210" x2="70" y2="185" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="110" y1="192" x2="105" y2="165" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="160" y1="192" x2="165" y2="165" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="190" y1="210" x2="200" y2="185" stroke="#5a6270" stroke-width="1.5"/>
    <text x="135" y="120" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Giai đoạn 1</text>
    <text x="135" y="335" font-size="12" fill="#5a6270" text-anchor="middle">Đào nóc hầm + phun vảy, neo đá</text>
    <text x="135" y="350" font-size="12" fill="#5a6270" text-anchor="middle">Top heading + shotcrete &amp; bolts</text>
  </g>

  <!-- Stage 2: bench excavated below, shotcrete extended -->
  <g>
    <rect x="300" y="140" width="200" height="150" fill="#e2e8e1"/>
    <path d="M320,290 C320,220 360,180 400,180 C440,180 480,220 480,290 Z" fill="#f3f5f4" stroke="#8a8f98" stroke-width="1.5"/>
    <path d="M327,235 C333,205 363,186 400,186 C437,186 467,205 473,235 L473,270 L327,270 Z" fill="none" stroke="#0a5c4a" stroke-width="5"/>
    <line x1="335" y1="255" x2="325" y2="245" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="465" y1="255" x2="475" y2="245" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="345" y1="210" x2="335" y2="185" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="455" y1="210" x2="465" y2="185" stroke="#5a6270" stroke-width="1.5"/>
    <text x="400" y="120" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Giai đoạn 2</text>
    <text x="400" y="335" font-size="12" fill="#5a6270" text-anchor="middle">Đào thân hầm, quan trắc hội tụ</text>
    <text x="400" y="350" font-size="12" fill="#5a6270" text-anchor="middle">Bench excavation + monitoring</text>
  </g>

  <!-- Stage 3: invert closed, full ring lining -->
  <g>
    <rect x="565" y="140" width="200" height="150" fill="#e2e8e1"/>
    <path d="M585,285 C585,215 625,180 665,180 C705,180 745,215 745,285 C745,290 585,290 585,285 Z" fill="#f3f5f4" stroke="#8a8f98" stroke-width="1.5"/>
    <path d="M592,235 C598,205 628,186 665,186 C702,186 732,205 738,235 L738,278 C700,285 630,285 592,278 Z" fill="none" stroke="#0a5c4a" stroke-width="5"/>
    <text x="665" y="120" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Giai đoạn 3</text>
    <text x="665" y="335" font-size="12" fill="#5a6270" text-anchor="middle">Khép kín đáy, hoàn thiện vỏ hầm</text>
    <text x="665" y="350" font-size="12" fill="#5a6270" text-anchor="middle">Invert closure, final lining</text>
  </g>

  <!-- arrows between panels -->
  <line x1="255" y1="215" x2="280" y2="215" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="520" y1="215" x2="545" y2="215" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Phương pháp NATM / New Austrian Tunnelling Method
  </text>
</svg>
