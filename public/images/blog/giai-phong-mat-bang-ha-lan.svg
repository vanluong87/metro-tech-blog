<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- three-stage sequence panels -->
  <g>
    <rect x="20" y="70" width="230" height="330" rx="8" fill="#ffffff" stroke="#d8dde1"/>
    <rect x="285" y="70" width="230" height="330" rx="8" fill="#ffffff" stroke="#d8dde1"/>
    <rect x="550" y="70" width="230" height="330" rx="8" fill="#ffffff" stroke="#d8dde1"/>
  </g>

  <!-- Stage 1: survey and mapping of existing utilities crossing the future corridor -->
  <g>
    <rect x="35" y="140" width="200" height="150" fill="#e2e8e1"/>
    <!-- future tunnel corridor, faint -->
    <rect x="105" y="140" width="60" height="150" fill="#ffffff" opacity="0.35"/>
    <!-- utility lines crossing the corridor -->
    <path d="M35,175 L235,175" stroke="#4a7fb0" stroke-width="5" fill="none"/>
    <path d="M35,210 L235,205" stroke="#c99a3e" stroke-width="5" fill="none"/>
    <path d="M35,245 L235,250" stroke="#8a8f98" stroke-width="5" fill="none"/>
    <path d="M35,280 L235,275" stroke="#b05a4a" stroke-width="5" fill="none"/>
    <!-- GPR scan head -->
    <rect x="118" y="150" width="34" height="14" rx="3" fill="#0a5c4a"/>
    <line x1="135" y1="164" x2="135" y2="286" stroke="#0a5c4a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="135" y="120" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Giai đoạn 1</text>
    <text x="135" y="335" font-size="12" fill="#5a6270" text-anchor="middle">Khảo sát &amp; lập bản đồ hạ tầng</text>
    <text x="135" y="350" font-size="12" fill="#5a6270" text-anchor="middle">Utility survey &amp; mapping</text>
  </g>

  <!-- Stage 2: utility relocation, lines rerouted around the corridor -->
  <g>
    <rect x="300" y="140" width="200" height="150" fill="#e2e8e1"/>
    <rect x="370" y="140" width="60" height="150" fill="#ffffff" opacity="0.35"/>
    <!-- old alignment, faded/dashed -->
    <path d="M300,175 L500,175" stroke="#4a7fb0" stroke-width="3" fill="none" opacity="0.3" stroke-dasharray="3 4"/>
    <path d="M300,210 L500,205" stroke="#c99a3e" stroke-width="3" fill="none" opacity="0.3" stroke-dasharray="3 4"/>
    <!-- rerouted lines curving around corridor -->
    <path d="M300,175 C 350,175 355,115 400,115 C 445,115 450,175 500,175" stroke="#4a7fb0" stroke-width="5" fill="none"/>
    <path d="M300,205 C 350,205 355,315 400,315 C 445,315 450,250 500,250" stroke="#c99a3e" stroke-width="5" fill="none"/>
    <path d="M300,245 L365,245" stroke="#8a8f98" stroke-width="5" fill="none"/>
    <path d="M435,245 L500,245" stroke="#8a8f98" stroke-width="5" fill="none"/>
    <path d="M300,280 L365,280" stroke="#b05a4a" stroke-width="5" fill="none"/>
    <path d="M435,280 L500,280" stroke="#b05a4a" stroke-width="5" fill="none"/>
    <text x="400" y="120" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Giai đoạn 2</text>
    <text x="400" y="335" font-size="12" fill="#5a6270" text-anchor="middle">Di dời hạ tầng ngầm</text>
    <text x="400" y="350" font-size="12" fill="#5a6270" text-anchor="middle">Utility relocation</text>
  </g>

  <!-- Stage 3: corridor cleared, ready for construction -->
  <g>
    <rect x="565" y="140" width="200" height="150" fill="#e2e8e1"/>
    <rect x="635" y="140" width="60" height="150" fill="#0a5c4a"/>
    <text x="665" y="220" font-size="10.5" fill="#ffffff" text-anchor="middle">hành lang</text>
    <text x="665" y="234" font-size="10.5" fill="#ffffff" text-anchor="middle">thi công</text>
    <!-- relocated lines now running clear of the corridor -->
    <path d="M565,175 C 600,175 610,110 635,110" stroke="#4a7fb0" stroke-width="5" fill="none"/>
    <path d="M695,110 C 720,110 730,175 765,175" stroke="#4a7fb0" stroke-width="5" fill="none"/>
    <path d="M565,320 C 600,320 610,300 635,300" stroke="#c99a3e" stroke-width="5" fill="none"/>
    <path d="M695,300 C 720,300 730,320 765,320" stroke="#c99a3e" stroke-width="5" fill="none"/>
    <text x="665" y="118" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Giai đoạn 3</text>
    <text x="665" y="335" font-size="12" fill="#5a6270" text-anchor="middle">Mặt bằng đã giải phóng</text>
    <text x="665" y="350" font-size="12" fill="#5a6270" text-anchor="middle">Site cleared, ready to build</text>
  </g>

  <!-- arrows between panels -->
  <line x1="255" y1="215" x2="280" y2="215" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="520" y1="215" x2="545" y2="215" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Giải phóng mặt bằng &amp; di dời hạ tầng ngầm / Site clearance &amp; utility relocation
  </text>
</svg>
