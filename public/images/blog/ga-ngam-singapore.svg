<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- ground -->
  <rect x="0" y="90" width="800" height="360" fill="#e2e8e1"/>
  <line x1="0" y1="90" x2="800" y2="90" stroke="#9fb09c" stroke-width="2"/>

  <!-- road surface restored on top, with traffic -->
  <rect x="0" y="70" width="800" height="20" fill="#3a3f47"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#e6c84a" stroke-width="2" stroke-dasharray="18 14"/>
  <text x="20" y="60" font-size="13" fill="#1a1d23">mặt đường khôi phục sớm / road reopened early</text>

  <!-- diaphragm walls -->
  <rect x="150" y="90" width="18" height="330" fill="#5a6270"/>
  <rect x="632" y="90" width="18" height="330" fill="#5a6270"/>
  <text x="120" y="80" font-size="12" fill="#5a6270" text-anchor="end">tường vây</text>
  <text x="120" y="93" font-size="12" fill="#5a6270" text-anchor="end">diaphragm</text>
  <text x="680" y="80" font-size="12" fill="#5a6270">tường vây</text>
  <text x="680" y="93" font-size="12" fill="#5a6270">diaphragm</text>

  <!-- top-down slabs, cast first -->
  <rect x="168" y="110" width="464" height="16" fill="#0a5c4a"/>
  <text x="400" y="105" font-size="13" fill="#0a5c4a" text-anchor="middle" font-weight="600">Sàn tầng trên cùng (đổ trước) / top slab cast first</text>

  <rect x="168" y="220" width="464" height="14" fill="#3a8a72"/>
  <text x="400" y="215" font-size="12" fill="#245c4c" text-anchor="middle">Sàn B1</text>

  <rect x="168" y="330" width="464" height="14" fill="#3a8a72"/>
  <text x="400" y="325" font-size="12" fill="#245c4c" text-anchor="middle">Sàn B2</text>

  <!-- base slab -->
  <rect x="168" y="404" width="464" height="16" fill="#245c4c"/>
  <text x="400" y="440" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Sàn đáy / base slab</text>

  <!-- excavation stage indicator (dashed, still being dug between slabs) -->
  <g stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="6 5" fill="none">
    <rect x="185" y="126" width="430" height="90"/>
    <rect x="185" y="234" width="430" height="92"/>
    <rect x="185" y="344" width="430" height="56"/>
  </g>
  <text x="400" y="175" font-size="12" fill="#8a8f98" text-anchor="middle">đào đất bên dưới sàn đã đổ</text>
  <text x="400" y="192" font-size="12" fill="#8a8f98" text-anchor="middle">excavate under cast slab</text>

  <text x="400" y="30" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Thi công ga ngầm kiểu top-down / Top-down underground station construction
  </text>
</svg>
