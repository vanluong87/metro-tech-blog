<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Mô hình BIM xuyên suốt vòng đời dự án metro
  </text>
  <text x="400" y="53" font-size="12" fill="#5a6270" text-anchor="middle">
    BIM data flow across the metro project lifecycle
  </text>

  <!-- main panel -->
  <rect x="30" y="75" width="740" height="230" rx="8" fill="#ffffff" stroke="#d8dde1"/>

  <!-- Stage 1: Design model -->
  <g>
    <rect x="60" y="110" width="190" height="160" rx="6" fill="#eef1f0"/>
    <text x="155" y="132" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Thiết kế / Design</text>

    <!-- simple isometric cube representing 3D model -->
    <g transform="translate(110,150)">
      <polygon points="45,10 85,30 45,50 5,30" fill="#c9d6d1" stroke="#5a6270" stroke-width="1.2"/>
      <polygon points="5,30 45,50 45,95 5,75" fill="#dfe9e6" stroke="#5a6270" stroke-width="1.2"/>
      <polygon points="85,30 45,50 45,95 85,75" fill="#8a8f98" stroke="#5a6270" stroke-width="1.2" opacity="0.6"/>
    </g>
    <text x="155" y="258" font-size="10" fill="#5a6270" text-anchor="middle">Mô hình đa bộ môn / multidisciplinary model</text>
  </g>

  <!-- clash marker on design stage -->
  <circle cx="225" cy="165" r="10" fill="#ffffff" stroke="#0a5c4a" stroke-width="2"/>
  <text x="225" y="169" font-size="11" fill="#0a5c4a" text-anchor="middle" font-weight="700">!</text>
  <text x="225" y="192" font-size="8.5" fill="#0a5c4a" text-anchor="middle" font-weight="600">clash</text>

  <!-- arrow 1 -->
  <line x1="255" y1="190" x2="300" y2="190" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrowB)"/>

  <!-- Stage 2: Construction -->
  <g>
    <rect x="305" y="110" width="190" height="160" rx="6" fill="#eef1f0"/>
    <text x="400" y="132" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Thi công / Construction</text>

    <rect x="335" y="155" width="130" height="18" rx="3" fill="#dfe9e6"/>
    <rect x="335" y="155" width="90" height="18" rx="3" fill="#0a5c4a"/>
    <text x="400" y="185" font-size="9" fill="#5a6270" text-anchor="middle">Theo dõi tiến độ &amp; khối lượng</text>
    <text x="400" y="198" font-size="8.5" fill="#5a6270" text-anchor="middle">progress &amp; quantity tracking</text>

    <rect x="335" y="215" width="130" height="18" rx="3" fill="#dfe9e6"/>
    <rect x="335" y="215" width="55" height="18" rx="3" fill="#8a8f98"/>
    <text x="400" y="245" font-size="9" fill="#5a6270" text-anchor="middle">Mô hình cập nhật theo công trường</text>
    <text x="400" y="258" font-size="8.5" fill="#5a6270" text-anchor="middle">model updated from site</text>
  </g>

  <!-- arrow 2 -->
  <line x1="500" y1="190" x2="545" y2="190" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrowB)"/>

  <!-- Stage 3: Operations -->
  <g>
    <rect x="550" y="110" width="190" height="160" rx="6" fill="#eef1f0"/>
    <text x="645" y="132" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Vận hành / Operations</text>

    <rect x="580" y="150" width="130" height="95" rx="5" fill="#ffffff" stroke="#0a5c4a" stroke-width="1.5"/>
    <text x="645" y="172" font-size="10" fill="#0a5c4a" text-anchor="middle" font-weight="600">As-built BIM</text>
    <line x1="595" y1="185" x2="695" y2="185" stroke="#d8dde1" stroke-width="1"/>
    <text x="645" y="202" font-size="8.5" fill="#5a6270" text-anchor="middle">Quản lý tài sản</text>
    <line x1="595" y1="212" x2="695" y2="212" stroke="#d8dde1" stroke-width="1"/>
    <text x="645" y="228" font-size="8.5" fill="#5a6270" text-anchor="middle">Kế hoạch bảo trì</text>
  </g>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text x="400" y="400" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Phát hiện xung đột sớm giúp giảm chi phí sửa đổi khi thi công
  </text>
  <text x="400" y="420" font-size="11" fill="#5a6270" text-anchor="middle">
    Early clash detection reduces costly rework during construction
  </text>
</svg>
