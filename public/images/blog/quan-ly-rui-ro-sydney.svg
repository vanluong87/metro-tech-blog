<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Quản lý rủi ro &amp; kiểm soát ngân sách dự án metro
  </text>
  <text x="400" y="53" font-size="12" fill="#5a6270" text-anchor="middle">
    Risk management &amp; budget control for metro programs
  </text>

  <!-- Risk matrix panel (left) -->
  <g>
    <rect x="40" y="80" width="330" height="260" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="205" y="104" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Ma trận rủi ro / Risk matrix</text>

    <!-- axes -->
    <line x1="100" y1="300" x2="100" y2="130" stroke="#8a8f98" stroke-width="1.5"/>
    <line x1="100" y1="300" x2="330" y2="300" stroke="#8a8f98" stroke-width="1.5"/>
    <text x="78" y="130" font-size="9" fill="#5a6270" text-anchor="end">Cao</text>
    <text x="78" y="298" font-size="9" fill="#5a6270" text-anchor="end">Thấp</text>
    <text x="205" y="320" font-size="9" fill="#5a6270" text-anchor="middle">Xác suất / Probability →</text>
    <text x="60" y="215" font-size="9" fill="#5a6270" text-anchor="middle" transform="rotate(-90 60 215)">Ảnh hưởng / Impact</text>

    <!-- grid cells, green=low risk, gray=med, accent dark for high -->
    <rect x="101" y="131" width="76" height="56" fill="#dfe9e6"/>
    <rect x="177" y="131" width="76" height="56" fill="#c9d6d1"/>
    <rect x="253" y="131" width="76" height="56" fill="#0a5c4a"/>

    <rect x="101" y="187" width="76" height="56" fill="#eef1f0"/>
    <rect x="177" y="187" width="76" height="56" fill="#dfe9e6"/>
    <rect x="253" y="187" width="76" height="56" fill="#c9d6d1"/>

    <rect x="101" y="243" width="76" height="56" fill="#f3f5f4"/>
    <rect x="177" y="243" width="76" height="56" fill="#eef1f0"/>
    <rect x="253" y="243" width="76" height="56" fill="#dfe9e6"/>

    <!-- dots representing located risks -->
    <circle cx="290" cy="150" r="5" fill="#ffffff" stroke="#1a1d23" stroke-width="1.2"/>
    <text x="290" y="145" font-size="8" fill="#1a1d23" text-anchor="middle" font-weight="700">1</text>
    <circle cx="215" cy="205" r="5" fill="#ffffff" stroke="#1a1d23" stroke-width="1.2"/>
    <text x="215" y="200" font-size="8" fill="#1a1d23" text-anchor="middle" font-weight="700">2</text>
    <circle cx="140" cy="260" r="5" fill="#ffffff" stroke="#1a1d23" stroke-width="1.2"/>
    <text x="140" y="255" font-size="8" fill="#1a1d23" text-anchor="middle" font-weight="700">3</text>

    <text x="205" y="355" font-size="9" fill="#5a6270" text-anchor="middle">1 Địa chất 2 Hạ tầng ngầm 3 Thị trường XD</text>
  </g>

  <!-- risk register panel (right) -->
  <g>
    <rect x="400" y="80" width="360" height="260" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="580" y="104" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Khung kiểm soát / Control framework</text>

    <rect x="420" y="120" width="320" height="38" rx="4" fill="#eef1f0"/>
    <text x="580" y="143" font-size="11" fill="#1a1d23" text-anchor="middle">1. Nhận diện &amp; sổ đăng ký rủi ro</text>

    <rect x="420" y="165" width="320" height="38" rx="4" fill="#eef1f0"/>
    <text x="580" y="188" font-size="11" fill="#1a1d23" text-anchor="middle">2. Đánh giá xác suất &amp; mức ảnh hưởng</text>

    <rect x="420" y="210" width="320" height="38" rx="4" fill="#0a5c4a"/>
    <text x="580" y="233" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">3. Dự phòng ngân sách (contingency)</text>

    <rect x="420" y="255" width="320" height="38" rx="4" fill="#eef1f0"/>
    <text x="580" y="278" font-size="11" fill="#1a1d23" text-anchor="middle">4. Phân bổ rủi ro trong hợp đồng</text>

    <rect x="420" y="300" width="320" height="30" rx="4" fill="#eef1f0"/>
    <text x="580" y="320" font-size="11" fill="#1a1d23" text-anchor="middle">5. Rà soát độc lập / Independent assurance</text>
  </g>

  <text x="400" y="400" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Quản lý rủi ro có hệ thống giúp kiểm soát vượt ngân sách
  </text>
  <text x="400" y="420" font-size="11" fill="#5a6270" text-anchor="middle">
    Structured risk management helps control cost overruns
  </text>
</svg>
