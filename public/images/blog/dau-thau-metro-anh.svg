<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Quy trình đấu thầu quốc tế &amp; lựa chọn nhà thầu EPC
  </text>
  <text x="400" y="53" font-size="12" fill="#5a6270" text-anchor="middle">
    International tendering &amp; EPC contractor selection process
  </text>

  <!-- connecting line -->
  <line x1="90" y1="180" x2="710" y2="180" stroke="#d8dde1" stroke-width="3"/>

  <!-- Step 1 -->
  <g>
    <circle cx="90" cy="180" r="28" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="90" y="186" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">1</text>
    <rect x="20" y="230" width="140" height="90" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="90" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Sơ tuyển</text>
    <text x="90" y="272" font-size="11" fill="#5a6270" text-anchor="middle">năng lực</text>
    <text x="90" y="298" font-size="10" fill="#8a8f98" text-anchor="middle">Pre-</text>
    <text x="90" y="312" font-size="10" fill="#8a8f98" text-anchor="middle">qualification</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="245" cy="180" r="28" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="245" y="186" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">2</text>
    <rect x="175" y="230" width="140" height="90" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="245" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Hồ sơ mời</text>
    <text x="245" y="272" font-size="11" fill="#5a6270" text-anchor="middle">thầu (ITT)</text>
    <text x="245" y="298" font-size="10" fill="#8a8f98" text-anchor="middle">Invitation to</text>
    <text x="245" y="312" font-size="10" fill="#8a8f98" text-anchor="middle">Tender</text>
  </g>

  <!-- Step 3 - highlighted as key/accent -->
  <g>
    <circle cx="400" cy="180" r="30" fill="#0a5c4a"/>
    <text x="400" y="187" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
    <rect x="325" y="228" width="150" height="94" rx="6" fill="#0a5c4a"/>
    <text x="400" y="255" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Đối thoại</text>
    <text x="400" y="272" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">cạnh tranh</text>
    <text x="400" y="298" font-size="10" fill="#dfe9e6" text-anchor="middle">Competitive</text>
    <text x="400" y="312" font-size="10" fill="#dfe9e6" text-anchor="middle">dialogue</text>
  </g>

  <!-- Step 4 -->
  <g>
    <circle cx="555" cy="180" r="28" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="555" y="186" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">4</text>
    <rect x="485" y="230" width="140" height="90" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="555" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Đánh giá hồ</text>
    <text x="555" y="272" font-size="11" fill="#5a6270" text-anchor="middle">sơ dự thầu</text>
    <text x="555" y="298" font-size="10" fill="#8a8f98" text-anchor="middle">Bid</text>
    <text x="555" y="312" font-size="10" fill="#8a8f98" text-anchor="middle">evaluation</text>
  </g>

  <!-- Step 5 -->
  <g>
    <circle cx="710" cy="180" r="28" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="710" y="186" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">5</text>
    <rect x="640" y="230" width="140" height="90" rx="6" fill="#ffffff" stroke="#d8dde1"/>
    <text x="710" y="255" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Ký hợp</text>
    <text x="710" y="272" font-size="11" fill="#5a6270" text-anchor="middle">đồng EPC</text>
    <text x="710" y="298" font-size="10" fill="#8a8f98" text-anchor="middle">Contract</text>
    <text x="710" y="312" font-size="10" fill="#8a8f98" text-anchor="middle">award</text>
  </g>

  <!-- package split motif at bottom: line divided into contract packages -->
  <g>
    <rect x="60" y="370" width="150" height="34" rx="4" fill="#ffffff" stroke="#5a6270" stroke-width="1.5"/>
    <text x="135" y="391" font-size="11" fill="#1a1d23" text-anchor="middle">Gói hầm / Tunnel</text>

    <rect x="225" y="370" width="150" height="34" rx="4" fill="#ffffff" stroke="#5a6270" stroke-width="1.5"/>
    <text x="300" y="391" font-size="11" fill="#1a1d23" text-anchor="middle">Gói ga / Station</text>

    <rect x="390" y="370" width="150" height="34" rx="4" fill="#ffffff" stroke="#5a6270" stroke-width="1.5"/>
    <text x="465" y="391" font-size="11" fill="#1a1d23" text-anchor="middle">Gói M&amp;E</text>

    <rect x="555" y="370" width="185" height="34" rx="4" fill="#0a5c4a"/>
    <text x="647" y="391" font-size="11" fill="#ffffff" text-anchor="middle">Tích hợp hệ thống</text>
  </g>
  <text x="400" y="425" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Chia nhỏ gói thầu để phân tán rủi ro / Splitting packages to distribute risk
  </text>
</svg>
