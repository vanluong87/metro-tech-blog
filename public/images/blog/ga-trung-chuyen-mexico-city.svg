<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- ground -->
  <rect x="0" y="60" width="800" height="390" fill="#e2e8e1"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#9fb09c" stroke-width="2"/>
  <rect x="0" y="40" width="800" height="20" fill="#3a3f47"/>
  <text x="20" y="34" font-size="13" fill="#1a1d23">mặt đường / street level</text>

  <!-- concourse / mezzanine -->
  <rect x="120" y="100" width="560" height="40" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="400" y="95" font-size="13" fill="#5a6270" text-anchor="middle">Tầng sảnh chờ (bán vé, biển chỉ dẫn) / concourse (ticketing, signage)</text>

  <!-- Line A platform level (upper) -->
  <rect x="60" y="180" width="680" height="70" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="80" y="205" width="260" height="20" fill="#d8dde1"/>
  <rect x="460" y="205" width="260" height="20" fill="#d8dde1"/>
  <rect x="340" y="200" width="120" height="30" fill="#8a8f98"/>
  <text x="400" y="220" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Tuyến A / Line A</text>
  <text x="400" y="172" font-size="12" fill="#5a6270" text-anchor="middle">Ke ga Tuyến A — hướng Đông-Tây / Line A platform — East-West</text>

  <!-- transfer passage between Line A and Line B (highlighted) -->
  <rect x="365" y="250" width="70" height="90" fill="#0a5c4a"/>
  <text x="400" y="275" font-size="11" fill="#ffffff" text-anchor="middle">hành lang</text>
  <text x="400" y="289" font-size="11" fill="#ffffff" text-anchor="middle">đổi tuyến</text>
  <text x="400" y="305" font-size="10" fill="#e8f3ef" text-anchor="middle">transfer</text>
  <text x="400" y="318" font-size="10" fill="#e8f3ef" text-anchor="middle">passage</text>

  <!-- stairs/escalator marks on the transfer passage -->
  <g stroke="#e8f3ef" stroke-width="1.5">
    <line x1="375" y1="255" x2="375" y2="335"/>
    <line x1="385" y1="255" x2="385" y2="335"/>
    <line x1="395" y1="255" x2="395" y2="335"/>
  </g>

  <!-- Line B platform level (lower), perpendicular -->
  <rect x="60" y="340" width="680" height="75" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="80" y="368" width="260" height="20" fill="#d8dde1"/>
  <rect x="460" y="368" width="260" height="20" fill="#d8dde1"/>
  <rect x="340" y="362" width="120" height="30" fill="#5a6270"/>
  <text x="400" y="382" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Tuyến B / Line B</text>
  <text x="400" y="430" font-size="12" fill="#5a6270" text-anchor="middle">Ke ga Tuyến B — hướng Bắc-Nam / Line B platform — North-South</text>

  <!-- passenger flow arrows -->
  <g stroke="#0a5c4a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 220 205 C 220 260, 400 260, 400 250"/>
    <path d="M 580 205 C 580 260, 420 260, 420 250"/>
  </g>
  <g stroke="#5a6270" stroke-width="2" fill="none" marker-end="url(#arrow2)">
    <path d="M 220 368 C 220 310, 400 310, 400 340"/>
    <path d="M 580 368 C 580 310, 420 310, 420 340"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0a5c4a"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6270"/>
    </marker>
  </defs>

  <text x="400" y="22" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Ga trung chuyển kiểu chồng tầng / Stacked interchange station
  </text>
</svg>
