<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- sky / street band -->
  <rect x="0" y="0" width="800" height="100" fill="#eef1ee"/>
  <rect x="0" y="92" width="800" height="10" fill="#3a3f47"/>
  <line x1="0" y1="97" x2="800" y2="97" stroke="#e6c84a" stroke-width="2" stroke-dasharray="18 14"/>

  <!-- rain -->
  <g stroke="#7fa8d9" stroke-width="2" opacity="0.8">
    <line x1="60" y1="10" x2="48" y2="40"/>
    <line x1="110" y1="5" x2="98" y2="35"/>
    <line x1="160" y1="15" x2="148" y2="45"/>
    <line x1="640" y1="10" x2="628" y2="40"/>
    <line x1="690" y1="5" x2="678" y2="35"/>
    <line x1="740" y1="15" x2="728" y2="45"/>
  </g>
  <text x="400" y="25" font-size="13" fill="#4d6b96" text-anchor="middle">mưa lớn bất thường / sudden heavy rainstorm</text>

  <!-- underground structure block -->
  <rect x="0" y="102" width="800" height="330" fill="#e2e8e1"/>

  <!-- raised entrance threshold with stairs down -->
  <g>
    <rect x="90" y="92" width="110" height="10" fill="#8a8f98"/>
    <text x="145" y="86" font-size="11" fill="#5a6270" text-anchor="middle">ngưỡng nâng cao / raised threshold</text>
    <path d="M90,102 L100,140 L190,140 L200,102 Z" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
    <g stroke="#8a8f98" stroke-width="1.5">
      <line x1="103" y1="112" x2="187" y2="112"/>
      <line x1="106" y1="122" x2="184" y2="122"/>
      <line x1="109" y1="132" x2="181" y2="132"/>
    </g>
  </g>

  <!-- flood barrier at entrance -->
  <rect x="95" y="96" width="100" height="14" fill="#0a5c4a" opacity="0.9"/>
  <text x="145" y="106" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">chắn nước / flood barrier</text>

  <!-- collection channel in front of entrance -->
  <rect x="60" y="100" width="18" height="8" fill="#5a6270"/>
  <rect x="212" y="100" width="18" height="8" fill="#5a6270"/>

  <!-- concourse level -->
  <rect x="240" y="140" width="320" height="90" fill="#ffffff" stroke="#d8dde1"/>
  <text x="400" y="165" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Sảnh ga / Concourse</text>
  <text x="400" y="182" font-size="11" fill="#5a6270" text-anchor="middle">rãnh thu nước sàn / floor drains</text>
  <g stroke="#5a6270" stroke-width="1.5">
    <line x1="270" y1="222" x2="530" y2="222"/>
    <line x1="290" y1="222" x2="280" y2="230"/>
    <line x1="340" y1="222" x2="330" y2="230"/>
    <line x1="460" y1="222" x2="450" y2="230"/>
    <line x1="510" y1="222" x2="500" y2="230"/>
  </g>

  <!-- pipe down to sump pit -->
  <rect x="392" y="230" width="16" height="130" fill="#8a8f98"/>

  <!-- sump pit at lowest level -->
  <rect x="320" y="360" width="160" height="60" rx="4" fill="#ffffff" stroke="#5a6270" stroke-width="2"/>
  <text x="400" y="380" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Hố bơm / Sump pit</text>

  <!-- duty / standby pumps -->
  <circle cx="355" cy="400" r="14" fill="#0a5c4a"/>
  <text x="355" y="404" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">P1</text>
  <circle cx="445" cy="400" r="14" fill="#0a5c4a"/>
  <text x="445" y="404" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">P2</text>
  <text x="400" y="438" font-size="11" fill="#5a6270" text-anchor="middle">bơm duty / standby</text>

  <!-- discharge pipe with check valve to street drain -->
  <path d="M480,390 C 560,390 600,330 600,230 L600,100" fill="none" stroke="#8a8f98" stroke-width="8"/>
  <rect x="585" y="150" width="30" height="16" fill="#5a6270"/>
  <text x="600" y="190" font-size="10" fill="#5a6270" text-anchor="middle">van một chiều</text>
  <text x="600" y="203" font-size="10" fill="#5a6270" text-anchor="middle">check valve</text>
  <line x1="600" y1="100" x2="630" y2="70" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow3)"/>
  <text x="660" y="65" font-size="11" fill="#1a1d23">xả ra thoát nước đô thị</text>
  <text x="660" y="79" font-size="11" fill="#1a1d23">to municipal drainage</text>

  <!-- backup generator -->
  <rect x="610" y="330" width="80" height="50" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="650" y="352" font-size="11" fill="#1a1d23" text-anchor="middle" font-weight="600">Máy phát</text>
  <text x="650" y="366" font-size="10" fill="#5a6270" text-anchor="middle">backup power</text>
  <line x1="610" y1="355" x2="480" y2="395" stroke="#8a8f98" stroke-width="2" stroke-dasharray="5 4"/>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text x="400" y="441" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Hệ thống thoát nước &amp; bơm chống ngập ga ngầm / Underground station drainage &amp; flood-pump system
  </text>
</svg>
