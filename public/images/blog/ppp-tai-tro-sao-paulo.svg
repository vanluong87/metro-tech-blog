<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="35" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Mô hình hợp tác công-tư (PPP) trong tài trợ metro / PPP financing model for metro
  </text>

  <!-- Public sector box (left) -->
  <rect x="30" y="80" width="200" height="130" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="130" y="108" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Nhà nước</text>
  <text x="130" y="124" font-size="12" fill="#5a6270" text-anchor="middle">Public Sector</text>
  <text x="130" y="152" font-size="11" fill="#5a6270" text-anchor="middle">Quy hoạch mạng lưới</text>
  <text x="130" y="167" font-size="11" fill="#5a6270" text-anchor="middle">Network planning</text>
  <text x="130" y="187" font-size="11" fill="#5a6270" text-anchor="middle">Trợ giá / bảo đảm doanh thu</text>
  <text x="130" y="202" font-size="11" fill="#5a6270" text-anchor="middle">Subsidy / revenue guarantee</text>

  <!-- Private partner box (right) -->
  <rect x="570" y="80" width="200" height="130" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="670" y="108" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Đối tác tư nhân</text>
  <text x="670" y="124" font-size="12" fill="#5a6270" text-anchor="middle">Private Partner</text>
  <text x="670" y="152" font-size="11" fill="#5a6270" text-anchor="middle">Vốn đầu tư, xây dựng</text>
  <text x="670" y="167" font-size="11" fill="#5a6270" text-anchor="middle">Capital &amp; construction</text>
  <text x="670" y="187" font-size="11" fill="#5a6270" text-anchor="middle">Vận hành đoàn tàu</text>
  <text x="670" y="202" font-size="11" fill="#5a6270" text-anchor="middle">Train operation</text>

  <!-- Metro project hub (center) -->
  <rect x="300" y="90" width="200" height="110" rx="8" fill="#0a5c4a"/>
  <text x="400" y="128" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Dự án Metro</text>
  <text x="400" y="146" font-size="12" fill="#e2e8e1" text-anchor="middle">Metro Project</text>
  <text x="400" y="172" font-size="11" fill="#e2e8e1" text-anchor="middle">Hầm · ga · đoàn tàu</text>
  <text x="400" y="187" font-size="11" fill="#e2e8e1" text-anchor="middle">Tunnels · stations · trains</text>

  <!-- arrows public -> project -->
  <line x1="230" y1="145" x2="295" y2="145" stroke="#1a1d23" stroke-width="2.5" marker-end="url(#arrowp)"/>
  <!-- arrows private -> project -->
  <line x1="570" y1="145" x2="505" y2="145" stroke="#1a1d23" stroke-width="2.5" marker-end="url(#arrowp)"/>

  <!-- shared risk label between -->
  <rect x="300" y="215" width="200" height="30" rx="6" fill="#ffffff" stroke="#d8dde1"/>
  <text x="400" y="235" font-size="11" fill="#5a6270" text-anchor="middle">Rủi ro &amp; lợi ích chia sẻ / Shared risk &amp; return</text>

  <!-- Passengers box (bottom center) -->
  <rect x="300" y="340" width="200" height="80" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="400" y="368" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Hành khách</text>
  <text x="400" y="384" font-size="12" fill="#5a6270" text-anchor="middle">Passengers</text>
  <text x="400" y="404" font-size="11" fill="#5a6270" text-anchor="middle">Dịch vụ vận chuyển / Transit service</text>

  <!-- arrow project -> passengers (service) -->
  <line x1="380" y1="200" x2="380" y2="335" stroke="#1a1d23" stroke-width="2.5" marker-end="url(#arrowp)"/>
  <text x="330" y="280" font-size="10" fill="#5a6270" text-anchor="middle">Dịch vụ / Service</text>

  <!-- arrow passengers -> private (fares, dashed) -->
  <path d="M500,380 C 620,380 660,300 660,215" fill="none" stroke="#0a5c4a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowg)"/>
  <text x="600" y="320" font-size="10" fill="#0a5c4a" text-anchor="middle">Vé / Fares</text>

  <defs>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a5c4a"/>
    </marker>
  </defs>
</svg>
