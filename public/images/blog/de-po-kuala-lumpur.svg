<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="30" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Sơ đồ bố trí đề-pô &amp; khu bảo dưỡng đoàn tàu / Metro depot and maintenance facility layout
  </text>

  <!-- main line -->
  <line x1="20" y1="230" x2="130" y2="230" stroke="#5a6270" stroke-width="4"/>
  <g stroke="#8a8f98" stroke-width="2">
    <line x1="35" y1="224" x2="35" y2="236"/>
    <line x1="55" y1="224" x2="55" y2="236"/>
    <line x1="75" y1="224" x2="75" y2="236"/>
    <line x1="95" y1="224" x2="95" y2="236"/>
    <line x1="115" y1="224" x2="115" y2="236"/>
  </g>
  <text x="75" y="210" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">Tuyến chính</text>
  <text x="75" y="254" font-size="11" fill="#5a6270" text-anchor="middle">Main line</text>

  <!-- depot throat (fan of turnouts) -->
  <g stroke="#5a6270" stroke-width="3" fill="none">
    <path d="M130,230 L220,110"/>
    <path d="M130,230 L220,180"/>
    <path d="M130,230 L220,250"/>
    <path d="M130,230 L220,320"/>
    <path d="M130,230 L190,350"/>
  </g>
  <text x="150" y="155" font-size="11" fill="#1a1d23" font-weight="600">1. Ghi nối ray</text>
  <text x="150" y="168" font-size="10" fill="#5a6270">Access turnouts</text>

  <!-- wash plant spur -->
  <rect x="140" y="355" width="110" height="45" rx="4" fill="#ffffff" stroke="#d8dde1"/>
  <rect x="140" y="355" width="110" height="8" fill="#0a5c4a"/>
  <text x="195" y="378" font-size="10" fill="#1a1d23" text-anchor="middle" font-weight="600">3. Nhà rửa tàu</text>
  <text x="195" y="391" font-size="9" fill="#5a6270" text-anchor="middle">Wash plant</text>

  <!-- stabling yard tracks -->
  <g stroke="#8a8f98" stroke-width="3">
    <line x1="220" y1="110" x2="420" y2="110"/>
    <line x1="220" y1="180" x2="450" y2="180"/>
    <line x1="220" y1="250" x2="450" y2="250"/>
    <line x1="220" y1="320" x2="420" y2="320"/>
  </g>

  <!-- parked trains in yard -->
  <g fill="#8a8f98" stroke="#5a6270" stroke-width="1">
    <rect x="250" y="102" width="70" height="16" rx="3"/>
    <rect x="330" y="102" width="70" height="16" rx="3"/>
    <rect x="245" y="172" width="70" height="16" rx="3"/>
    <rect x="250" y="312" width="70" height="16" rx="3"/>
    <rect x="330" y="312" width="70" height="16" rx="3"/>
  </g>

  <text x="330" y="90" font-size="12" fill="#1a1d23" text-anchor="middle" font-weight="600">2. Bãi đỗ tàu</text>
  <text x="330" y="420" font-size="11" fill="#5a6270" text-anchor="middle">Stabling yard</text>

  <!-- workshop building -->
  <rect x="470" y="70" width="300" height="320" rx="8" fill="#ffffff" stroke="#d8dde1" stroke-width="1.5"/>
  <rect x="470" y="70" width="300" height="14" fill="#3a3f47"/>
  <text x="620" y="55" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">4. Xưởng bảo dưỡng</text>
  <text x="620" y="415" font-size="11" fill="#5a6270" text-anchor="middle">Maintenance workshop</text>

  <!-- through tracks into workshop -->
  <line x1="450" y1="180" x2="750" y2="180" stroke="#8a8f98" stroke-width="3"/>
  <line x1="450" y1="250" x2="750" y2="250" stroke="#8a8f98" stroke-width="3"/>

  <!-- inspection pits -->
  <rect x="560" y="168" width="120" height="24" fill="#3a3f47"/>
  <rect x="560" y="238" width="120" height="24" fill="#3a3f47"/>
  <text x="620" y="205" font-size="9" fill="#d8dde1" text-anchor="middle">5. Hố kiểm tra / Inspection pit</text>

  <!-- trains under maintenance (key element, accent green) -->
  <rect x="510" y="163" width="220" height="34" rx="4" fill="#0a5c4a"/>
  <rect x="510" y="233" width="220" height="34" rx="4" fill="#0a5c4a" opacity="0.85"/>
  <text x="620" y="184" font-size="11" fill="#eafff6" text-anchor="middle">tàu đang bảo dưỡng</text>

  <!-- overhead crane schematic -->
  <g stroke="#5a6270" stroke-width="2" fill="none">
    <line x1="490" y1="100" x2="750" y2="100"/>
    <line x1="500" y1="100" x2="500" y2="112"/>
    <line x1="620" y1="100" x2="620" y2="112"/>
    <line x1="740" y1="100" x2="740" y2="112"/>
  </g>
  <text x="620" y="320" font-size="10" fill="#5a6270" text-anchor="middle">cầu trục nâng / overhead crane</text>
  <text x="620" y="334" font-size="9" fill="#8a8f98" text-anchor="middle">(tháo bogie / bogie removal)</text>
</svg>
