<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- tunnel/station background panel -->
  <rect x="0" y="40" width="800" height="300" fill="#ffffff"/>
  <rect x="0" y="40" width="800" height="300" fill="none" stroke="#d8dde1" stroke-width="2"/>

  <!-- platform -->
  <rect x="40" y="250" width="720" height="30" fill="#8a8f98"/>
  <text x="60" y="270" font-size="12" fill="#ffffff">ke ga / platform</text>

  <!-- platform screen doors -->
  <g stroke="#5a6270" stroke-width="3">
    <line x1="140" y1="150" x2="140" y2="250"/>
    <line x1="170" y1="150" x2="170" y2="250"/>
    <line x1="330" y1="150" x2="330" y2="250"/>
    <line x1="360" y1="150" x2="360" y2="250"/>
  </g>
  <rect x="140" y="150" width="30" height="100" fill="#d8dde1" opacity="0.6"/>
  <rect x="330" y="150" width="30" height="100" fill="#d8dde1" opacity="0.6"/>
  <text x="250" y="140" font-size="13" fill="#5a6270" text-anchor="middle">cửa chắn ke ga / platform screen doors</text>

  <!-- driverless train -->
  <rect x="170" y="170" width="160" height="60" rx="10" fill="#0a5c4a"/>
  <rect x="185" y="182" width="28" height="22" rx="3" fill="#eafff6"/>
  <rect x="223" y="182" width="28" height="22" rx="3" fill="#eafff6"/>
  <rect x="261" y="182" width="28" height="22" rx="3" fill="#eafff6"/>
  <text x="250" y="220" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">Tàu GoA4 — không buồng lái</text>
  <text x="250" y="105" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Tàu tự động / Driverless train (no cab)</text>

  <!-- intrusion detection sensors along platform edge -->
  <g fill="#0a5c4a">
    <circle cx="120" cy="140" r="4"/>
    <circle cx="400" cy="140" r="4"/>
    <circle cx="500" cy="140" r="4"/>
  </g>
  <g stroke="#0a5c4a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7">
    <line x1="120" y1="140" x2="120" y2="250"/>
    <line x1="400" y1="140" x2="400" y2="250"/>
  </g>

  <!-- OCC panel on right -->
  <rect x="560" y="80" width="200" height="190" rx="8" fill="#f3f5f4" stroke="#8a8f98" stroke-width="2"/>
  <text x="660" y="105" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Trung tâm điều hành (OCC)</text>
  <text x="660" y="122" font-size="11" fill="#5a6270" text-anchor="middle">Operations Control Center</text>

  <!-- screens -->
  <rect x="580" y="135" width="75" height="50" rx="4" fill="#ffffff" stroke="#5a6270" stroke-width="1.5"/>
  <rect x="665" y="135" width="75" height="50" rx="4" fill="#ffffff" stroke="#5a6270" stroke-width="1.5"/>
  <g stroke="#8a8f98" stroke-width="1.5">
    <line x1="590" y1="150" x2="645" y2="150"/>
    <line x1="590" y1="162" x2="630" y2="162"/>
    <line x1="675" y1="150" x2="730" y2="150"/>
    <line x1="675" y1="162" x2="715" y2="162"/>
  </g>
  <circle cx="617" cy="212" r="14" fill="#0a5c4a"/>
  <circle cx="703" cy="212" r="14" fill="#8a8f98"/>
  <text x="660" y="240" font-size="11" fill="#5a6270" text-anchor="middle">giám sát video + điều khiển từ xa</text>
  <text x="660" y="255" font-size="10" fill="#5a6270" text-anchor="middle">video monitoring + remote control</text>

  <!-- comms link between train/sensors and OCC -->
  <g stroke="#0a5c4a" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M400,140 C480,100 500,90 560,120"/>
  </g>
  <text x="470" y="95" font-size="11" fill="#0a5c4a" text-anchor="middle">CBTC / dữ liệu vị trí</text>

  <!-- track -->
  <g stroke="#5a6270" stroke-width="3">
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="312" x2="800" y2="312"/>
  </g>

  <text x="400" y="420" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Sơ đồ vận hành metro không người lái (GoA4) / Driverless metro operation (GoA4)
  </text>
</svg>
