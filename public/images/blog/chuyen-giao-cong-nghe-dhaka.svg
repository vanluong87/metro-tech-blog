<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- panel background -->
  <rect x="30" y="40" width="740" height="330" rx="10" fill="#ffffff" stroke="#d8dde1" stroke-width="2"/>

  <!-- step 1: foreign expert -->
  <g>
    <circle cx="130" cy="150" r="42" fill="#8a8f98"/>
    <circle cx="130" cy="132" r="15" fill="#f3f5f4"/>
    <path d="M100,172 q30,-28 60,0 z" fill="#f3f5f4"/>
    <text x="130" y="215" font-size="13" fill="#5a6270" text-anchor="middle" font-weight="600">Chuyên gia nước ngoài</text>
    <text x="130" y="232" font-size="11" fill="#8a8f98" text-anchor="middle">Foreign expert</text>
  </g>

  <!-- arrow 1 -->
  <line x1="182" y1="150" x2="248" y2="150" stroke="#5a6270" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="215" y="138" font-size="11" fill="#5a6270" text-anchor="middle">hướng dẫn</text>

  <!-- step 2: on-the-job training -->
  <g>
    <rect x="250" y="108" width="140" height="84" rx="8" fill="#eef2f0" stroke="#8a8f98" stroke-width="2"/>
    <circle cx="295" cy="150" r="18" fill="#8a8f98"/>
    <circle cx="295" cy="140" r="7" fill="#eef2f0"/>
    <path d="M283,162 q12,-12 24,0 z" fill="#eef2f0"/>
    <circle cx="345" cy="150" r="18" fill="#0a5c4a"/>
    <circle cx="345" cy="140" r="7" fill="#eef2f0"/>
    <path d="M333,162 q12,-12 24,0 z" fill="#eef2f0"/>
    <text x="320" y="215" font-size="13" fill="#5a6270" text-anchor="middle" font-weight="600">Đào tạo tại hiện trường</text>
    <text x="320" y="232" font-size="11" fill="#8a8f98" text-anchor="middle">On-the-job training</text>
  </g>

  <!-- arrow 2 -->
  <line x1="402" y1="150" x2="468" y2="150" stroke="#5a6270" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="435" y="138" font-size="11" fill="#5a6270" text-anchor="middle">thực hành</text>

  <!-- step 3: documentation / standards -->
  <g>
    <rect x="470" y="108" width="110" height="84" rx="6" fill="#eef2f0" stroke="#8a8f98" stroke-width="2"/>
    <line x1="486" y1="128" x2="564" y2="128" stroke="#8a8f98" stroke-width="3"/>
    <line x1="486" y1="144" x2="564" y2="144" stroke="#8a8f98" stroke-width="3"/>
    <line x1="486" y1="160" x2="540" y2="160" stroke="#8a8f98" stroke-width="3"/>
    <text x="525" y="215" font-size="13" fill="#5a6270" text-anchor="middle" font-weight="600">Tài liệu &amp; quy trình</text>
    <text x="525" y="232" font-size="11" fill="#8a8f98" text-anchor="middle">Standards &amp; procedures</text>
  </g>

  <!-- arrow 3 -->
  <line x1="592" y1="150" x2="648" y2="150" stroke="#0a5c4a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="620" y="138" font-size="11" fill="#0a5c4a" text-anchor="middle">tự chủ</text>

  <!-- step 4: local engineer independent -->
  <g>
    <circle cx="700" cy="150" r="42" fill="#0a5c4a"/>
    <circle cx="700" cy="132" r="15" fill="#eafff6"/>
    <path d="M670,172 q30,-28 60,0 z" fill="#eafff6"/>
    <text x="700" y="215" font-size="13" fill="#0a5c4a" text-anchor="middle" font-weight="600">Kỹ sư bản địa</text>
    <text x="700" y="232" font-size="11" fill="#5a6270" text-anchor="middle">Local engineer</text>
  </g>

  <!-- bottom row: continuity into operation & maintenance -->
  <rect x="70" y="270" width="660" height="70" rx="8" fill="#f3f5f4" stroke="#d8dde1" stroke-width="2"/>
  <text x="400" y="296" font-size="13" fill="#5a6270" text-anchor="middle" font-weight="600">
    Vận hành thử &amp; đào tạo bảo trì dài hạn
  </text>
  <text x="400" y="315" font-size="12" fill="#8a8f98" text-anchor="middle">
    Commissioning and long-term operations &amp; maintenance training
  </text>
  <line x1="130" y1="192" x2="130" y2="270" stroke="#8a8f98" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="700" y1="192" x2="700" y2="270" stroke="#0a5c4a" stroke-width="2" stroke-dasharray="4 3"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6270"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a5c4a"/>
    </marker>
  </defs>

  <text x="400" y="400" font-size="14" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Quy trình chuyển giao công nghệ metro / Metro technology transfer process
  </text>
</svg>
