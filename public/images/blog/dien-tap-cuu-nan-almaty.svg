<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <text x="400" y="38" font-size="18" fill="#1a1d23" text-anchor="middle" font-weight="700">
    Chu trình đào tạo ứng phó sự cố / Emergency response training cycle
  </text>

  <!-- step boxes -->
  <g font-size="13" text-anchor="middle">
    <!-- 1 classroom -->
    <rect x="30" y="150" width="130" height="90" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="95" y="185" font-size="26">📘</text>
    <text x="95" y="210" fill="#1a1d23" font-weight="600">Lý thuyết / SOP</text>
    <text x="95" y="227" fill="#5a6270" font-size="11">Classroom &amp; SOPs</text>

    <!-- 2 simulator -->
    <rect x="200" y="150" width="130" height="90" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="265" y="185" font-size="26">🖥️</text>
    <text x="265" y="210" fill="#1a1d23" font-weight="600">Mô phỏng</text>
    <text x="265" y="227" fill="#5a6270" font-size="11">Simulator training</text>

    <!-- 3 evacuation drill (key / accent) -->
    <rect x="370" y="140" width="150" height="110" rx="10" fill="#0a5c4a"/>
    <text x="445" y="178" font-size="28" fill="#eafff6">🚇</text>
    <text x="445" y="208" fill="#ffffff" font-weight="700">Diễn tập sơ tán</text>
    <text x="445" y="225" fill="#eafff6" font-size="11">Evacuation drill</text>

    <!-- 4 multi-agency -->
    <rect x="560" y="150" width="130" height="90" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
    <text x="625" y="185" font-size="26">🚒</text>
    <text x="625" y="210" fill="#1a1d23" font-weight="600">Phối hợp liên ngành</text>
    <text x="625" y="227" fill="#5a6270" font-size="11">Multi-agency drill</text>
  </g>

  <!-- arrows between boxes -->
  <g stroke="#5a6270" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="195" x2="195" y2="195"/>
    <line x1="330" y1="195" x2="365" y2="195"/>
    <line x1="520" y1="195" x2="555" y2="195"/>
  </g>

  <!-- debrief box, below, with loop-back arrow -->
  <rect x="300" y="310" width="200" height="80" rx="10" fill="#d8dde1" stroke="#8a8f98" stroke-width="2"/>
  <text x="400" y="340" font-size="24" text-anchor="middle">📝</text>
  <text x="400" y="365" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Rút kinh nghiệm (debrief)</text>
  <text x="400" y="381" font-size="11" fill="#5a6270" text-anchor="middle">Post-drill debrief</text>

  <path d="M625,240 L625,350 L500,350" fill="none" stroke="#5a6270" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M300,350 L95,350 L95,245" fill="none" stroke="#5a6270" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="195" y="412" font-size="12" fill="#5a6270" text-anchor="middle">điều chỉnh quy trình, lặp lại chu trình / feeds back into the next training cycle</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6270"/>
    </marker>
  </defs>
</svg>
