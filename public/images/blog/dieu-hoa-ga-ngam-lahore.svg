<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- main panel -->
  <rect x="30" y="50" width="740" height="330" rx="8" fill="#ffffff" stroke="#d8dde1" stroke-width="2"/>

  <!-- ground level line -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="70" y="82" font-size="10" fill="#5a6270">mặt đất khí hậu nóng / hot surface climate</text>

  <!-- chiller plant on surface (accent green, key element) -->
  <rect x="610" y="58" width="100" height="30" rx="4" fill="#0a5c4a"/>
  <circle cx="628" cy="73" r="7" fill="#ffffff" opacity="0.85"/>
  <circle cx="648" cy="73" r="7" fill="#ffffff" opacity="0.85"/>
  <circle cx="668" cy="73" r="7" fill="#ffffff" opacity="0.85"/>
  <circle cx="688" cy="73" r="7" fill="#ffffff" opacity="0.85"/>
  <text x="660" y="46" font-size="10.5" fill="#1a1d23" text-anchor="middle" font-weight="600">trạm chiller</text>
  <text x="660" y="35" font-size="10.5" fill="#1a1d23" text-anchor="middle" font-weight="600">chiller plant</text>

  <!-- chilled water pipe going down -->
  <line x1="660" y1="88" x2="660" y2="150" stroke="#0a5c4a" stroke-width="4"/>
  <path d="M660,150 l0,8 m-6,-4 l6,4 l6,-4" stroke="#0a5c4a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="675" y="120" font-size="9" fill="#5a6270">nước lạnh</text>
  <text x="675" y="130" font-size="9" fill="#5a6270">chilled water</text>

  <!-- concourse level box -->
  <rect x="60" y="150" width="680" height="80" fill="#eef1f0" stroke="#5a6270" stroke-width="2"/>
  <text x="90" y="142" font-size="11" fill="#5a6270">tầng trung chuyển / concourse level</text>

  <!-- AHU unit -->
  <rect x="610" y="168" width="90" height="32" rx="4" fill="#5a6270"/>
  <rect x="618" y="176" width="12" height="16" fill="#d8dde1"/>
  <rect x="634" y="176" width="12" height="16" fill="#d8dde1"/>
  <rect x="650" y="176" width="12" height="16" fill="#d8dde1"/>
  <rect x="666" y="176" width="12" height="16" fill="#d8dde1"/>
  <text x="655" y="214" font-size="9.5" fill="#1a1d23" text-anchor="middle">AHU</text>

  <!-- supply duct along concourse ceiling toward platform shaft -->
  <rect x="150" y="160" width="455" height="10" fill="#8a8f98"/>
  <text x="380" y="195" font-size="9" fill="#5a6270" text-anchor="middle">đường ống gió cấp / supply air duct</text>

  <!-- vertical duct shaft down to platform -->
  <rect x="195" y="170" width="16" height="60" fill="#8a8f98"/>
  <path d="M203,225 l0,-40 m-6,10 l6,-10 l6,10" stroke="#0a5c4a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- platform level box -->
  <rect x="60" y="230" width="680" height="90" fill="#eef1f0" stroke="#5a6270" stroke-width="2"/>
  <text x="90" y="222" font-size="11" fill="#5a6270">tầng ke ga / platform level</text>

  <!-- running rails -->
  <rect x="90" y="300" width="620" height="8" fill="#8a8f98"/>

  <!-- train -->
  <rect x="300" y="252" width="160" height="46" rx="6" fill="#dfe4e2" stroke="#5a6270" stroke-width="2"/>
  <rect x="312" y="262" width="30" height="18" rx="3" fill="#bcd8ce"/>
  <rect x="350" y="262" width="30" height="18" rx="3" fill="#bcd8ce"/>
  <rect x="388" y="262" width="30" height="18" rx="3" fill="#bcd8ce"/>
  <rect x="426" y="262" width="22" height="18" rx="3" fill="#bcd8ce"/>

  <!-- supply diffusers at platform ceiling (cool air down, green) -->
  <rect x="150" y="234" width="40" height="8" rx="2" fill="#0a5c4a"/>
  <path d="M170,246 l0,16 m-6,-6 l6,6 l6,-6" stroke="#0a5c4a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="520" y="234" width="40" height="8" rx="2" fill="#0a5c4a"/>
  <path d="M540,246 l0,16 m-6,-6 l6,6 l6,-6" stroke="#0a5c4a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- return air grille (warm air up, gray) -->
  <rect x="610" y="234" width="40" height="8" rx="2" fill="#8a8f98"/>
  <path d="M630,262 l0,-16 m-6,6 l6,-6 l6,6" stroke="#8a8f98" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- entrance with hot air infiltration callout -->
  <path d="M60,150 L60,90" stroke="#5a6270" stroke-width="2"/>
  <path d="M60,110 l-18,0" stroke="#8a8f98" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="38" y="105" font-size="8.5" fill="#5a6270" text-anchor="end">nhiệt xâm nhập</text>
  <text x="38" y="115" font-size="8.5" fill="#5a6270" text-anchor="end">heat infiltration</text>

  <!-- legend -->
  <circle cx="90" cy="358" r="5" fill="#0a5c4a"/>
  <text x="102" y="362" font-size="10" fill="#1a1d23">khí lạnh cấp / cool supply air</text>
  <circle cx="330" cy="358" r="5" fill="#8a8f98"/>
  <text x="342" y="362" font-size="10" fill="#1a1d23">khí hồi / return air</text>

  <!-- titles -->
  <text x="400" y="30" font-size="15" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Điều hòa không khí &amp; làm mát ga ngầm trong khí hậu nóng
  </text>
  <text x="400" y="410" font-size="12" fill="#5a6270" text-anchor="middle">
    Air conditioning &amp; cooling for underground stations in hot climates
  </text>
</svg>
