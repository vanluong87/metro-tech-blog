<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="450" fill="#f3f5f4"/>

  <!-- station concourse floor -->
  <rect x="0" y="330" width="800" height="120" fill="#e3e7e4"/>
  <line x1="0" y1="330" x2="800" y2="330" stroke="#c7cdc9" stroke-width="2"/>

  <!-- TVM panel -->
  <rect x="50" y="150" width="110" height="160" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
  <rect x="65" y="165" width="80" height="55" rx="4" fill="#d8dde1"/>
  <circle cx="90" cy="245" r="7" fill="#5a6270"/>
  <circle cx="120" cy="245" r="7" fill="#5a6270"/>
  <rect x="75" y="270" width="60" height="16" rx="3" fill="#5a6270"/>
  <text x="105" y="330" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">TVM</text>
  <text x="105" y="346" font-size="11" fill="#5a6270" text-anchor="middle">máy bán vé / vending</text>

  <!-- arrow from TVM to gate -->
  <line x1="170" y1="260" x2="250" y2="260" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- fare gate pair -->
  <g>
    <rect x="260" y="200" width="36" height="130" rx="6" fill="#5a6270"/>
    <rect x="470" y="200" width="36" height="130" rx="6" fill="#5a6270"/>
    <rect x="296" y="200" width="174" height="12" fill="#8a8f98"/>
    <rect x="296" y="318" width="174" height="12" fill="#8a8f98"/>

    <!-- gate flaps (open) -->
    <rect x="300" y="230" width="8" height="70" rx="3" fill="#d8dde1" transform="rotate(-25 304 265)"/>
    <rect x="462" y="230" width="8" height="70" rx="3" fill="#d8dde1" transform="rotate(25 466 265)"/>

    <!-- contactless reader on right post -->
    <rect x="476" y="215" width="24" height="24" rx="4" fill="#0a5c4a"/>
    <path d="M488,220 a7,7 0 0 1 0,14 M488,223 a4,4 0 0 1 0,8" stroke="#eafff6" stroke-width="1.5" fill="none"/>

    <text x="383" y="350" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Cổng soát vé / Fare gate</text>
  </g>

  <!-- rider approaching with card -->
  <circle cx="400" cy="260" r="16" fill="#0a5c4a"/>
  <rect x="440" y="222" width="18" height="12" rx="2" fill="#0a5c4a" opacity="0.85"/>
  <line x1="400" y1="276" x2="400" y2="320" stroke="#0a5c4a" stroke-width="6" stroke-linecap="round"/>
  <line x1="396" y1="320" x2="392" y2="332" stroke="#0a5c4a" stroke-width="5" stroke-linecap="round"/>
  <line x1="404" y1="320" x2="408" y2="332" stroke="#0a5c4a" stroke-width="5" stroke-linecap="round"/>

  <!-- arrow from gate to backend -->
  <line x1="510" y1="260" x2="600" y2="260" stroke="#1a1d23" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- back-office server -->
  <rect x="610" y="160" width="140" height="150" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
  <rect x="628" y="178" width="104" height="22" rx="3" fill="#d8dde1"/>
  <rect x="628" y="206" width="104" height="22" rx="3" fill="#d8dde1"/>
  <rect x="628" y="234" width="104" height="22" rx="3" fill="#d8dde1"/>
  <circle cx="640" cy="189" r="4" fill="#0a5c4a"/>
  <circle cx="640" cy="217" r="4" fill="#0a5c4a"/>
  <circle cx="640" cy="245" r="4" fill="#0a5c4a"/>
  <text x="680" y="330" font-size="13" fill="#1a1d23" text-anchor="middle" font-weight="600">Back-office</text>
  <text x="680" y="346" font-size="11" fill="#5a6270" text-anchor="middle">đối soát / reconciliation</text>

  <!-- small payment icons row above rider -->
  <g font-size="11" fill="#5a6270">
    <rect x="355" y="150" width="30" height="20" rx="3" fill="#d8dde1"/>
    <text x="370" y="163" text-anchor="middle" font-size="9" fill="#1a1d23">thẻ vé</text>
    <rect x="395" y="150" width="30" height="20" rx="3" fill="#d8dde1"/>
    <text x="410" y="163" text-anchor="middle" font-size="9" fill="#1a1d23">ngân hàng</text>
    <rect x="435" y="150" width="30" height="20" rx="3" fill="#d8dde1"/>
    <text x="450" y="163" text-anchor="middle" font-size="7.5" fill="#1a1d23">QR app</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1d23"/>
    </marker>
  </defs>

  <text x="400" y="400" font-size="14" fill="#1a1d23" text-anchor="middle" font-weight="600">
    Sơ đồ nguyên lý hệ thống thu phí tự động AFC / Automatic fare collection (AFC) principle
  </text>
</svg>
